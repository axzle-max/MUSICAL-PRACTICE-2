<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
<title>Sight and Sound</title>
<style>
/* Layout: one fixed-height app. Tab bar at the bottom in portrait, a left rail in landscape and on iPad.
   Practice > mode screen (preview + grouped settings + big Play) > full-screen play > result.
   Play screens replace the whole shell, so nothing ever sits on top of anything else (sheets are the only modals).
   Palette: iOS grouped greys, white cards, system blue for selection, one mint-green Play button. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F2F2F7; --ink:#0B0B0F; --muted:#6B6B73; --sep:rgba(60,60,67,.16);
  --blue:#007AFF; --blue-soft:rgba(0,122,255,.12); --play:#1F9D6A; --play-ink:#FFFFFF;
  --ok:#2E9E4F; --bad:#E5352B; --warn:#D98200; --extra:#8E44C8; --range:#FFE94A; --staff:#0B0B0F;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 18px -8px rgba(0,0,0,.25); --pillbg:#FFFFFF;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",system-ui,Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --ink:#F5F5F7; --muted:#9A9AA2; --sep:rgba(84,84,88,.55);
    --blue:#0A84FF; --blue-soft:rgba(10,132,255,.22); --play:#32D583; --play-ink:#04210F;
    --ok:#4CD27A; --bad:#FF6259; --warn:#FFB340; --extra:#C58BFF; --range:#8A7A10; --staff:#E9E9EE;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px -8px rgba(0,0,0,.7); --pillbg:#2C2C2E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --ink:#F5F5F7; --muted:#9A9AA2; --sep:rgba(84,84,88,.55);
  --blue:#0A84FF; --blue-soft:rgba(10,132,255,.22); --play:#32D583; --play-ink:#04210F;
  --ok:#4CD27A; --bad:#FF6259; --warn:#FFB340; --extra:#C58BFF; --range:#8A7A10; --staff:#E9E9EE;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px -8px rgba(0,0,0,.7); --pillbg:#2C2C2E; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;height:var(--appH,100%)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 var(--font);-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
textarea,input{-webkit-user-select:text;user-select:text}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
svg{display:block}
.ico{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.fill{fill:currentColor;stroke:none}

/* ---------- shell ---------- */
#app{position:relative;height:100%;height:var(--appH,100%);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;min-width:0}
#shell{display:contents}
.views{min-height:0;min-width:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;position:relative}
.tabbar{display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);border-top:1px solid var(--sep);padding:0 max(8px,env(safe-area-inset-left,0px)) 0 max(8px,env(safe-area-inset-right,0px))}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;padding:6px 2px 4px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:600}
.tab .ico{width:25px;height:25px}
.tab[aria-selected="true"]{color:var(--blue)}
@media (orientation:landscape) and (max-height:620px),(min-width:900px){
  #app{grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
  .tabbar{order:-1;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--sep);padding:10px 8px 10px max(8px,env(safe-area-inset-left,0px));width:calc(84px + env(safe-area-inset-left,0px))}
  .tab{flex:none;min-height:60px;border-radius:12px}
  .tab[aria-selected="true"]{background:var(--blue-soft)}
}
.page{max-width:980px;margin:0 auto;padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));display:grid;gap:18px;align-content:start;min-width:0}
.nav{display:flex;align-items:center;gap:8px;min-height:44px}
.nav .grow{flex:1;min-width:0}
.back{display:inline-flex;align-items:center;gap:2px;border:0;background:none;color:var(--blue);font-size:17px;font-weight:500;min-height:44px;padding:0 8px 0 0;margin-left:-6px}
.back .ico{width:26px;height:26px;stroke-width:2.6}
.large{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.title{font-size:20px;font-weight:700;text-align:center}
.cap{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:0 16px 6px}
.foot{font-size:13px;color:var(--muted);padding:6px 16px 0}

/* ---------- grouped lists ---------- */
.group{background:var(--card);border-radius:14px;overflow:hidden;min-width:0}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;position:relative;width:100%;border:0;background:none;text-align:left;font-size:17px}
.row+.row::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--sep)}
.row .lab{flex:1;min-width:0}
.row .lab small{display:block;color:var(--muted);font-size:13px;font-weight:400;margin-top:1px}
.row .val{color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0;text-align:right}
.row .val span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .chev{width:9px;height:9px;border-right:2.4px solid var(--muted);border-top:2.4px solid var(--muted);transform:rotate(45deg);margin-left:2px;opacity:.6;flex:none}
button.row:active{background:var(--sep)}
.seg{display:inline-flex;background:var(--card2);border-radius:9px;padding:2px;gap:2px;min-width:0;max-width:100%}
.group .seg{background:color-mix(in srgb,var(--muted) 16%,transparent)}
.seg button{border:0;background:none;min-height:32px;padding:0 12px;border-radius:7px;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;flex:1 1 auto}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.22)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366}}
.row .seg{flex:none}
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;z-index:2;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:99px;background:color-mix(in srgb,var(--muted) 35%,transparent);transition:background .15s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .15s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:3px solid var(--blue);outline-offset:2px}
.step{display:inline-flex;align-items:center;gap:2px;background:var(--card2);border-radius:9px;overflow:hidden}
.group .step{background:color-mix(in srgb,var(--muted) 16%,transparent)}
.step button{width:44px;height:34px;border:0;background:none;font-size:22px;font-weight:500;line-height:1}
.step output{min-width:54px;text-align:center;font:600 17px var(--mono);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--blue);min-height:34px}
.rowfull{display:grid;gap:8px;padding:10px 16px 12px}
.rowfull+.row::before,.row+.rowfull::before{content:"";position:absolute}
.rowfull{position:relative}
.rowfull+.row::before{left:16px;right:0;top:0;height:1px;background:var(--sep)}

/* ---------- buttons ---------- */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 26px;border-radius:999px;border:0;background:var(--pillbg);box-shadow:var(--shadow);font-size:20px;font-weight:600}
.pill:active:not(:disabled){transform:scale(.97)}
.pill:disabled{opacity:.4}
.pill.blue{background:var(--blue);color:#fff}
.pill.green{background:var(--play);color:var(--play-ink)}
.pill.sm{min-height:44px;font-size:17px;padding:0 20px}
.pill.on{background:var(--blue);color:#fff}
.bigplay{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;width:100%;border:0;border-radius:18px;background:var(--play);color:var(--play-ink);font-size:21px;font-weight:700;box-shadow:var(--shadow)}
.bigplay:active{transform:scale(.985)}
.bigplay .ico{width:26px;height:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:0;background:var(--card);font-size:16px;font-weight:600;color:var(--blue)}
.btn.fill{background:var(--blue);color:#fff}
.btn.danger{color:var(--bad)}
.btn.line{background:transparent;border:1px solid var(--sep)}
.link{border:0;background:none;color:var(--blue);font-size:16px;font-weight:500;padding:8px 4px;min-height:44px}
.chip{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:99px;background:var(--card2);font:600 13px var(--mono);color:var(--muted)}
.chip.blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- home ---------- */
.homehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hbtns{display:flex;align-items:center;gap:10px}
.soundpill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--sep);background:var(--card);font-size:16px;font-weight:600}
.soundpill .ico{width:22px;height:22px}
.goal{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 4px 0 10px;border-radius:999px;border:0;background:var(--card);box-shadow:var(--shadow)}
.goal b{font:700 15px var(--mono);font-variant-numeric:tabular-nums}
.ringsvg{width:34px;height:34px;transform:rotate(-90deg)}
.ringsvg circle{fill:none;stroke-width:5}
.ringsvg .bg{stroke:var(--sep)}
.ringsvg .fg{stroke:var(--blue);stroke-linecap:round;transition:stroke-dashoffset .4s}
.cont{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;background:var(--play);color:var(--play-ink);border-radius:18px;padding:14px 18px;border:0;width:100%;text-align:left;box-shadow:var(--shadow)}
.cont .ico{width:34px;height:34px}
.cont b{font-size:20px;display:block}
.cont span{opacity:.9;font-size:14px}
.modes{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.mode{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;min-height:92px;padding:14px 16px;border:0;border-radius:18px;background:var(--card);text-align:left;box-shadow:var(--shadow);width:100%}
.mode:active{transform:scale(.99)}
.mode .tile{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;background:var(--t);color:var(--c)}
.mode .tile svg{width:44px;height:44px}
.mode h3{font-size:19px;font-weight:700;letter-spacing:-.01em}
.mode p{font-size:14px;color:var(--muted);margin-top:2px}
.mode .last{font:600 12px var(--mono);color:var(--c);margin-top:4px;display:block}
.mode .chev{width:10px;height:10px;border-right:2.6px solid var(--muted);border-top:2.6px solid var(--muted);transform:rotate(45deg);opacity:.5}
.m-pitch{--c:#007AFF;--t:rgba(0,122,255,.12)} .m-rhythm{--c:#FF6B2C;--t:rgba(255,107,44,.14)} .m-dict{--c:#AF52DE;--t:rgba(175,82,222,.14)} .m-ear{--c:#1F9D6A;--t:rgba(31,157,106,.14)}
.hint{font-size:14px;color:var(--muted)}

/* ---------- mode setup ---------- */
.setupgrid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);min-width:0}
@media (min-width:760px){ .setupgrid{grid-template-columns:minmax(220px,300px) minmax(0,1fr)} }
@media (min-width:760px) and (min-height:520px){ .previewcol{position:sticky;top:12px;align-self:start} }
.previewcol{display:grid;gap:12px;min-width:0}
.preview{background:var(--card);border-radius:14px;padding:14px;display:grid;gap:8px;justify-items:center;min-width:0}
.preview svg{width:100%;height:auto;max-height:230px}
.preview .pl{font-size:14px;color:var(--muted);text-align:center}
.settingscol{display:grid;gap:18px;min-width:0}
.playbar{padding:10px max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 94%,transparent);border-top:1px solid var(--sep)}
.playbar .bigplay{max-width:520px;margin:0 auto}
.playcol{display:none}
@media (min-width:1000px) and (min-height:520px){
  .setupgrid{grid-template-columns:minmax(220px,280px) minmax(0,1fr) 150px}
  .playcol{display:block;position:sticky;top:12px;align-self:start}
  .playcol .bigplay{min-height:190px;flex-direction:column;border-radius:20px}
  .playcol .bigplay .ico{width:44px;height:44px}
  .playbar.mob{display:none}
}
.views.hasbar{display:grid;grid-template-rows:minmax(0,1fr) auto}
.views.hasbar>.scroll{overflow-y:auto;min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

/* ---------- sheets ---------- */
#sheetlayer{position:fixed;inset:0;z-index:100;display:none}
#sheetlayer.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);max-height:86%;background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.3);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-height:700px) and (min-width:700px){ .sheet{bottom:auto;top:50%;transform:translate(-50%,-50%);border-radius:20px;max-height:80%} }
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;min-height:56px}
.sheethead h2{font-size:18px;font-weight:700;text-align:center;flex:1}
.sheethead .link{min-width:60px}
.sheetbody{overflow-y:auto;padding:0 16px 16px;display:grid;gap:14px;align-content:start;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.opt .tick{width:22px;height:22px;stroke:var(--blue);fill:none;stroke-width:3;opacity:0}
.opt[aria-checked="true"] .tick{opacity:1}
textarea.code{width:100%;min-height:180px;border:1px solid var(--sep);border-radius:12px;background:var(--card);padding:12px;font:13px/1.45 var(--mono);resize:vertical}
pre.code{margin:0;padding:12px;border-radius:12px;background:var(--card);font:12.5px/1.45 var(--mono);overflow:auto;white-space:pre;max-height:200px;-webkit-user-select:text;user-select:text}
.msg{padding:10px 14px;border-radius:12px;background:var(--blue-soft);font-size:15px}
.msg.bad{background:color-mix(in srgb,var(--bad) 16%,transparent)}

/* range editor */
.rng{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.rngstage{position:relative;height:300px;max-width:360px;width:100%;margin:0 auto}
.rngstage svg{width:100%;height:100%}
.arrows{position:absolute;left:0;display:flex;background:var(--card);border:1px solid var(--sep);border-radius:10px;overflow:hidden;transform:translateY(-50%)}
.arrows button{width:50px;height:40px;border:0;background:none;display:grid;place-items:center}
.arrows button+button{border-left:1px solid var(--sep)}
.arrows .ico{width:22px;height:22px}

/* ---------- play screens ---------- */
#play{position:absolute;inset:0;background:var(--bg);display:none;grid-template-rows:auto minmax(0,1fr) auto;z-index:50;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#play.on{display:grid}
.pbar{display:flex;align-items:center;gap:12px;min-height:50px;padding:4px 14px;min-width:0}
.pbar .x{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;color:var(--ink);border-radius:50%;margin-left:-8px}
.pbar .x .ico{width:26px;height:26px}
.pbar .mid{flex:1;min-width:0;text-align:center;font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar .time{font:600 17px var(--mono);font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.pprog{height:3px;background:var(--sep)}
.pprog i{display:block;height:100%;width:0;background:var(--blue);transition:width .25s}
.pmain{min-height:0;display:flex;flex-direction:column;min-width:0}
.pfoot{min-width:0}

/* staff zone */
.staffzone{flex:1;min-height:0;display:flex;align-items:center;background:var(--card);border-top:1px solid var(--sep);border-bottom:1px solid var(--sep);position:relative;overflow:hidden}
.staffzone svg{display:block;width:100%;height:auto;max-height:100%}
.score .ln{stroke:var(--staff);fill:none}
.score .gl{fill:var(--staff)}
.score .nt{--nc:var(--staff)}
.score .nt .hf{fill:var(--nc)} .score .nt .hh{fill:none;stroke:var(--nc);stroke-width:2}
.score .nt .stem{stroke:var(--nc)}
.score .nt .rg{stroke:var(--nc);fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round} .score .nt .rf{fill:var(--nc)}
.score .nt .pg{fill:var(--nc)}
.score .nt .ln2{stroke:var(--nc)}
.score .beam{fill:var(--staff)}
.score .nt.cur{--nc:var(--blue)} .score .nt.ok{--nc:var(--ok)} .score .nt.bad{--nc:var(--bad)}
.score .nt.st-perfect{--nc:var(--ok)} .score .nt.st-good{--nc:#7BB800} .score .nt.st-ok{--nc:var(--warn)} .score .nt.st-miss{--nc:var(--bad)}
.score .nt.gone{opacity:0}
.score .nt{transition:opacity .3s}
.score .bn{font:600 11px var(--mono);fill:var(--muted);text-anchor:middle}
.score .ts{font:800 26px var(--font);fill:var(--staff);text-anchor:middle}
.score .hbg{fill:var(--card)}
.score .phead{stroke:var(--blue);stroke-width:2;opacity:.8}
.score .ptri{fill:var(--blue)}
.score .curbg{fill:var(--blue);opacity:.09}
.score .guide{stroke:var(--sep);stroke-width:1.5;stroke-dasharray:3 4}
.score .tapx{fill:var(--extra)}
.score .lab{font:700 11px var(--font);fill:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.score .hit{fill:transparent;cursor:pointer;pointer-events:all}
.score .mact{fill:var(--blue);opacity:.09}
.score .mbad{fill:var(--bad);opacity:.1}
.score .mok{fill:var(--ok);opacity:.1}
.score .actline{stroke:var(--blue);stroke-width:2.5;stroke-linecap:round}
.score *{pointer-events:none}
.score .hit{pointer-events:all}
.score .m{--nc:var(--staff)} .score .m.ok{--nc:var(--ok)} .score .m.bad{--nc:var(--bad)} .score .m.cor{--nc:var(--blue)}
.score .m .hf{fill:var(--nc)} .score .m .hh{fill:none;stroke:var(--nc);stroke-width:2} .score .m .stem{stroke:var(--nc);stroke-width:1.9}
.score .m .rg{stroke:var(--nc);fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round} .score .m .rf{fill:var(--nc)}
.score .m .beam{fill:var(--nc)}
.score .nt .stem{stroke-width:1.9}
.flash{position:absolute;inset:0;pointer-events:none;background:var(--bad);opacity:0}
.flash.on{animation:flash .35s}
@keyframes flash{0%{opacity:.18}100%{opacity:0}}

/* piano */
.kbd{position:relative;width:100%;height:100%;min-height:90px;background:var(--card)}
.kbd .wh{position:absolute;top:0;bottom:0;border:1px solid var(--sep);border-top:0;background:#fff;border-radius:0 0 8px 8px;padding:0;display:flex;align-items:flex-end;justify-content:center;color:#111;font-size:clamp(14px,2.6vw,20px);font-weight:500;padding-bottom:10px;touch-action:manipulation}

@media (orientation:landscape) and (max-height:520px){

.jctl{display:grid;gap:8px}
.jrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.jwin .chipb{min-width:0;padding:0 12px}

<script>
'use strict';

/* ======================================================================
   1. STATE + STORAGE
   Global state S, saved data, cloud sync, streaks and totals.
   ====================================================================== */

// ---- Saved state, cloud sync and stats ----

function mergeInto(dst, src, def) {
  if (!src || typeof src !== 'object') {
    return;
  }
  for (var k in def) {
    if (src[k] === undefined) {
      continue;
    }
    if (def[k] && typeof def[k] === 'object' && !Array.isArray(def[k])) {
      mergeInto(dst[k], src[k], def[k]);
    } else {
      dst[k] = src[k];
    }
  }
}
var cloudRef = null;
var pushT = 0;
var cloudState = 'local';
function snapshot() {
  return {
    prefs: S.prefs,
    pitch: S.pitch,
    rhythm: S.rhythm,
    dict: S.dict,
    ear: S.ear,
    tools: S.tools,
    presets: S.presets.slice(0, 60),
    log: S.log.slice(0, LOG_CAP),
    hist: S.hist,
    items: S.items,
    last: S.last,
    at: S.at
  };
}
function persist() {
  S.at = Date.now();
  try {
    localStorage.setItem(STORE, JSON.stringify(snapshot()));
  } catch (e) {}
  if (cloudRef) {
    clearTimeout(pushT);
    pushT = setTimeout(pushCloud, 800);
  }
}
function pushCloud() {
  if (!cloudRef) {
    return;
  }
  try {
    var p = cloudRef.set(JSON.parse(JSON.stringify(snapshot())));
    if (p && p.catch) {
      p.catch(function () {});
    }
  } catch (e) {}
}
function mergeList(a, b, key, sortKey) {
  var seen = {};
  var out = [];
  (a || []).concat(b || []).forEach(function (x) {
    if (x && x[key] && !seen[x[key]]) {
      seen[x[key]] = 1;
      out.push(x);
    }
  });
  out.sort(function (p, q) {
    return (q[sortKey] || 0) - (p[sortKey] || 0);
  });
  return out;
}
function mergeRemote(r) {
  if (!r) {
    return false;
  }
  var n0 = S.log.length + S.presets.length + S.hist.length + itemCount();
  S.log = mergeList(S.log, r.log, 'id', 'at').slice(0, LOG_CAP);
  S.presets = mergeList(S.presets, r.presets, 'id', 'at').slice(0, 60);
  S.hist = mergeHist(S.hist, r.hist);
  S.items = mergeItems(S.items, r.items);
  if ((r.at || 0) > S.at) {
    var keep = JSON.parse(JSON.stringify(S));
    mergeInto(S, r, DEF);
    S.log = keep.log;
    S.presets = keep.presets;
    S.hist = keep.hist;
    S.items = keep.items;
    S.at = r.at;
  }
  histSync();
  try {
    localStorage.setItem(STORE, JSON.stringify(snapshot()));
  } catch (e) {}
  return S.log.length + S.presets.length + S.hist.length + itemCount() !== n0;
}
function startCloud() {
  var c = window.claude;
  if (!c || !c.use) {
    return;
  }
  Promise.all([c.use('db'), c.use('user')])
    .then(function (r) {
      var db = r[0];
      var user = r[1];
      if (!db || !user) {
        return;
      }
      return user.id().then(function (uid) {
        if (!uid) {
          return;
        }
        var ref = db.collection('data/users/' + uid).doc('sightsound2');
        var first = true;
        ref.onSnapshot(
          function (snap) {
            var data = snap.exists ? snap.data() : null;
            cloudRef = ref;
            cloudState = 'synced';
            var ch = data ? mergeRemote(JSON.parse(JSON.stringify(data))) : false;
            if (first) {
              first = false;
              if (!data || ch) {
                pushCloud();
              }
            }
            applyTheme();
            if (typeof onCloud === 'function') {
              onCloud();
            }
          },
          function () {
            cloudRef = null;
            cloudState = 'local';
          }
        );
      });
    })
    .catch(function () {});
}
function applyTheme() {
  var t = S.prefs.theme;
  var r = document.documentElement;
  if (t === 'light' || t === 'dark') {
    r.setAttribute('data-theme', t);
  } else {
    r.removeAttribute('data-theme');
  }
}
/* ---------- log helpers ---------- */
function addLog(e) {
  e.id = newId();
  e.at = Date.now();
  S.log.unshift(e);
  S.log = S.log.slice(0, LOG_CAP);
  S.last = e.mode;
  histSync();
  persist();
}
function todaySecs() {
  var d = totals().days[dayKey()];
  return d ? d.s : 0;
}
// ---- Streak, rest day and weekly goal ----

/* Monday of the week that holds date d, as a day key. */
function weekKey(d) {
  var t = new Date(d);
  t.setDate(t.getDate() - ((t.getDay() + 6) % 7));
  return dayKey(t);
}
/* True when this week's rest day was already needed to keep the streak. */
/* Minutes and practice days so far in the current week (Monday to Sunday). */
/* Days in a row with practice, counted back from today (an empty today does not break
   it). With `rest`, one empty day per week is forgiven when the day before it was practised;
   the rest day itself is not counted. days = {dayKey: anything}.
   Returns {n: streak length, restUsed: {weekKey: true}}. */
function streakInfo(days, now, rest) {
  var restUsed = {};
  var n = 0;
  var d = new Date(now);
  d.setHours(12, 0, 0, 0);
  if (!days[dayKey(d)]) {
    d.setDate(d.getDate() - 1);
  }
  for (var guard = 0; guard < 5000; guard++) {
    if (days[dayKey(d)]) {
      n++;
    } else {
      var before = new Date(d);
      before.setDate(before.getDate() - 1);
      var wk = weekKey(d);
      if (!rest || restUsed[wk] || !days[dayKey(before)]) {
        break;
      }
      restUsed[wk] = true;
    }
    d.setDate(d.getDate() - 1);
  }
  return { n: n, restUsed: restUsed };
}
/* True when this week's rest day is already keeping the streak alive. */
function restDayUsed() {
  var now = new Date();
  var info = streakInfo(totals().days, now, S.prefs.rest !== false);
  return !!info.restUsed[weekKey(now)];
}
function weekStats(now) {
  var d = new Date(now);
  d.setHours(12, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  var out = { mins: 0, days: 0 };
  var tally = totals().days;
  for (var i = 0; i < 7; i++) {
    var t = tally[dayKey(d)];
    if (t) {
      out.mins += Math.floor(t.s / 60);
      out.days++;
    }
    d.setDate(d.getDate() + 1);

function streak() {
  return streakInfo(totals().days, new Date(), S.prefs.rest !== false).n;
}
/* Delete the practice history: raw log, permanent totals and per-item results. */
function clearHistory() {
  S.log = [];
  S.hist = [];
  S.items = {};
  histTouch();
}
// ---- Permanent history: totals never lose data when the raw log is trimmed ----

/* S.hist holds one short string per finished session: id|mode|score|secs|time
   (the last two in base 36). It is never trimmed, so "all time" stays correct.
   The raw log (S.log, newest first, capped at LOG_CAP) keeps the details. */
var histCache = null;
var totalsCache = null;
function histPack(e) {
  return [
    e.id,
    e.mode.charAt(0),
    Math.round(e.score || 0),
    Math.round(e.secs || 0).toString(36),
    Math.round(e.at || 0).toString(36)
  ].join('|');
}
function histUnpack(str) {
  var p = str.split('|');
  return {
    id: p[0],
    mode: MODE_ORDER.filter(function (m) {
      return m.charAt(0) === p[1];
    })[0],
    score: +p[2] || 0,
    secs: parseInt(p[3], 36) || 0,
    at: parseInt(p[4], 36) || 0
  };
}
function histId(str) {
  return str.split('|')[0];
}
function histTouch() {
  histCache = null;
  totalsCache = null;
}
/* Every session as {id, mode, score, secs, at}, newest first. */
function histAll() {
  if (!histCache) {
    histCache = S.hist.map(histUnpack).filter(function (h) {
      return h.mode && h.id;
    });
    histCache.sort(function (a, b) {
      return b.at - a.at;
    });
  }
  return histCache;
}
/* Sessions in the last `days` days (0 = all time). */
function histIn(days) {
  var cut = days ? Date.now() - days * 864e5 : 0;
  return histAll().filter(function (h) {
    return h.at >= cut;
  });
}
/* Add every log entry that is not in the history yet. Safe to call at any time. */
function histSync() {
  var seen = {};
  S.hist.forEach(function (str) {
    seen[histId(str)] = 1;
  });
  var added = 0;
  S.log.forEach(function (e) {
    if (e && e.id && MODES[e.mode] && !seen[e.id]) {
      seen[e.id] = 1;
      S.hist.push(histPack(e));
      added++;
    }
  });
  if (added || !histCache) {
    histTouch();
  }
  return added;
}
function mergeHist(a, b) {
  var seen = {};
  var out = [];
  (a || []).concat(b || []).forEach(function (str) {
    if (typeof str === 'string' && !seen[histId(str)]) {
      seen[histId(str)] = 1;
      out.push(str);
    }
  });
  histTouch();
  return out;
}
function newTally() {
  return { s: 0, n: 0, sc: 0, best: 0 };
}
function addToTally(t, h) {
  t.s += h.secs;
  t.n++;
  t.sc += h.score;
  t.best = Math.max(t.best, h.score);
}
/* Permanent totals: per day, per mode and overall (seconds, sessions, score sum, best). */
function totals() {
  if (!totalsCache) {
    var t = { days: {}, modes: {}, all: newTally() };
    histAll().forEach(function (h) {
      var dk = dayKey(h.at);
      addToTally(t.days[dk] || (t.days[dk] = newTally()), h);
      addToTally(t.modes[h.mode] || (t.modes[h.mode] = newTally()), h);
      addToTally(t.all, h);
    });
    totalsCache = t;
  }
  return totalsCache;
}
function tallyAvg(t) {
  return t && t.n ? Math.round(t.sc / t.n) : null;
}

// ---- Per-item results (one record per note, interval, rhythm value ...) ----

/* S.items[id] = {n tries, ok right, t last time, ms average answer time, mn timed tries,

   Ids look like "ear|interval|m6", "pitch|treble|F#4", "rhythm|12|0" (ticks|rest). */
var ITEM_RECENT = 8;
function itemId(mode, a, b) {
  return [mode, a, b].join('|');
}
function recordItem(id, right, ms) {
  var it = S.items[id] || (S.items[id] = { n: 0, ok: 0, t: 0, ms: 0, mn: 0, r: '' });
  it.n++;
  if (right) {
    it.ok++;
  }
  it.t = Date.now();
  it.r = (it.r + (right ? '1' : '0')).slice(-ITEM_RECENT);
  if (ms > 0) {
    it.ms = Math.round((it.ms * it.mn + ms) / (it.mn + 1));
    it.mn++;
  }
}
function itemCount() {
  return Object.keys(S.items).length;
}
/* Per item the record that was updated last wins. */
function mergeItems(a, b) {
  var out = {};
  [a || {}, b || {}].forEach(function (src) {
    Object.keys(src).forEach(function (id) {
      var x = src[id];
      var cur = out[id];
      if (x && x.n && (!cur || x.t > cur.t || (x.t === cur.t && x.n > cur.n))) {
        out[id] = x;
      }
    });
  });
  return out;
}
var tokNames = null;
/* Rhythm value name -> {t, r}, e.g. "quarter notes" -> {t: 12, r: 0}. */
function tokByName() {
  if (!tokNames) {
    tokNames = {};
    Object.keys(BM).forEach(function (t) {
      [0, 1].forEach(function (r) {
        tokNames[tokName(+t, r)] = { t: +t, r: r };

    });
  }
  return tokNames;
}
/* Readable description of an item id: {mode, label, sub}. */
function itemInfo(id) {
  var p = id.split('|');
  var mode = p[0];
  if (mode === 'pitch') {
    return { mode: mode, label: p[2], sub: (CLEFS[p[1]] || { name: p[1] }).name + ' clef' };

  if (mode === 'ear') {
    var it = EAR[p[1]] && earItem(p[1], p[2]);
    return {
      mode: mode,
      label: it && p[1] !== 'degree' ? it[1] : p[2],
      sub: EAR[p[1]] ? EAR[p[1]].name : p[1]

  }
  var name = tokName(+p[1], +p[2]);

}

  if (mode === 'pitch') {
    return itemId('pitch', clef || S.pitch.clef, label);

  if (mode === 'ear') {

  tool: null,

var ACT = {};

// ---- Practice session state ----

var P = null;
var Play = {};
var lastOpt = null; // options of the running session (item sessions), reused by Again

// ---- Saved state, cloud sync and stats ----

var STORE = 'sightsound.v2';
var LOG_CAP = 400; // raw sessions kept; totals live in S.hist and are never trimmed
var S = null;
/* Load the saved state from localStorage on top of the defaults (old saves keep working). */
function loadSaved() {

  var saved = null;

    saved = JSON.parse(localStorage.getItem(STORE) || 'null');
  } catch (e) {}

    mergeInto(S, saved, DEF);

    top = 0;
  }
  var hasBar = false;

  if (R.tab === 'home' && R.setup && R.edit) {
    html = editorPage(R.setup);
    hasBar = R.setup === 'pitch' || R.setup === 'ear';

    var xb = Math.max.apply(null, xs);

/* score: clef id from the option or the mean pitch */
function scoreClefId(all, o) {

function scoreSvg(bars, meter, keyInfo, W, o) {

    bars: bars,
    Y: Y,

function tabSvg(ev, tun, W, cellsPerBar, total, o) {

  var used = {};
  var prev = null;
  keys.forEach(function (k) {
    var d = new Date(k + 'T12:00:00');
    var gap = prev ? Math.round((d - prev) / 864e5) : 0;
    var missing = null;
    if (gap === 2) {

    if (prev && gap === 1) {

    } else {

    best = Math.max(best, run);

}

var CAL = null;
/* Wire the calibration tap pad (records taps, plays feedback) */
function calibBindPad(pad) {
  pad.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    if (!CAL || CAL.done) {
      return;
    }
    var n = A.now();
    CAL.taps.push(n);
    if (S.prefs.sound) {
      A.perc(n, S.prefs.inst);
    }
    pad.classList.add('hit');
    setTimeout(function () {
      pad.classList.remove('hit');
    }, 80);
  });
}
/* One status-poll tick of the calibration run */
function calibTickStatus(iv, t0, sec) {
  if (!CAL || CAL.done) {
    clearInterval(iv);
    return;
  }
  var n = A.now();
  var st = $('calstat');
  if (!st) {
    return;
  }
  if (n < t0) {
    st.textContent = 'Get ready…';
  } else if (n < t0 + 4 * sec) {
    st.textContent = 'Count-in ' + (Math.floor((n - t0) / sec) + 1);
  } else if (n < t0 + 12 * sec + 0.3) {
    st.textContent = 'Tap with the clicks ' + Math.min(8, Math.floor((n - t0) / sec) - 3) + '/8';
  } else {
    clearInterval(iv);
    calFinish();
  }
}
ACT.calib = function () {
  if (!A.unlock()) {
    toast('Audio is not available');
    return;
  }
  CAL = { taps: [], clicks: [], done: false, t0: 0 };
  openSheet(
    'Calibrate',
    '<p class="hint">Tap the pad exactly on each click. Four count-in clicks, then eight to tap along with.</p><div class="calstat" id="calstat">Get ready…</div><button type="button" class="tappad calpad" id="calpad" aria-label="Tap on each click">TAP</button><div id="calres"></div>',
    function () {
      if (CAL) {
        CAL.done = true;
        A.stop();
        CAL = null;
      }
    }
  );
  var bpm = 100;
  var sec = 60 / bpm;
  var t0 = A.now() + 0.8;
  CAL.t0 = t0;
  for (var i = 0; i < 12; i++) {
    A.click(t0 + i * sec, i % 4 === 0);
    if (i >= 4) {
      CAL.clicks.push(t0 + i * sec);
    }

    calibTickStatus(iv, t0, sec);

function calFinish() {
  var C = CAL;
  if (!C) {
    return;
  }
  C.done = true;
  var errs = [];
  C.clicks.forEach(function (ck) {
    var best = null;
    C.taps.forEach(function (t) {
      var d = t - ck;
      if (Math.abs(d) < 0.35 && (best === null || Math.abs(d) < Math.abs(best))) {
        best = d;
      }
    });
    if (best !== null) {
      errs.push(best * 1000);
    }
  });
  var st = $('calstat');
  var res = $('calres');
  if (st) {
    st.textContent = 'Done';
  }
  if (errs.length < 4) {
    res.innerHTML =
      '<div class="msg bad">Only ' +
      errs.length +
      ' of 8 taps were heard. Try again.</div><button type="button" class="btn fill" style="width:100%;margin-top:10px" data-act="calib">Try again</button>';
    return;
  }
  errs.sort(function (a, b) {
    return a - b;
  });
  var med = errs[Math.floor(errs.length / 2)];
  var off = Math.round(-med / 5) * 5;
  C.off = off;
  res.innerHTML =
    '<div class="msg">Your taps landed about <b>' +
    Math.abs(Math.round(med)) +
    ' ms ' +
    (med > 0 ? 'late' : 'early') +
    '</b> (' +
    errs.length +
    ' of 8 heard). Suggested offset: <b>' +
    (off > 0 ? '+' : '') +
    off +

function drawRhythmEd(m) {
  var cu = S[m].custom;
  var M = METERS[cu.meter];
  var z = $('edzone');
  if (!z) {
    return;
  }
  var ed = R.ed;
  var w = z.clientWidth;
  rhythmStage(z, cu.measures, M, {
    cur: ed.cur,
    used: sumT(cu.measures[ed.cur]),
    hits: true,
    nums: true,
    scale: clamp(w / 340, 1, 1.45),
    res: cu.measures.map(function (x) {
      return sumT(x) === M.cap ? 'ok' : null;
    })
  });
  var rem = M.cap - sumT(cu.measures[ed.cur]);
  var done = cu.measures.every(function (x) {
    return sumT(x) === M.cap;
  });
  var st = $('edstat');
  if (st) {
    st.textContent =
      'Bar ' +
      (ed.cur + 1) +
      ' of ' +
      cu.measures.length +
      ' · ' +
      (rem === 0 ? 'full' : Math.round((rem / M.beat) * 100) / 100 + ' beats left') +
      (done ? ' · every bar is complete, ready to play' : '');
  }
}

function edAdvance(m) {
  var cu = S[m].custom;
  var M = METERS[cu.meter];
  var ed = R.ed;
  if (sumT(cu.measures[ed.cur]) === M.cap) {
    for (var k = 1; k < cu.measures.length; k++) {
      var j = (ed.cur + k) % cu.measures.length;
      if (sumT(cu.measures[j]) < M.cap) {
        ed.cur = j;
        break;
      }
    }
  }
}

};
ACT.edbars = function (el) {
  var m = R.setup;

  if (d > 0 && cu.measures.length < 16) {
    cu.measures.push([]);
  } else if (d < 0 && cu.measures.length > 1) {
    cu.measures.pop();
    if (R.ed.cur >= cu.measures.length) {
      R.ed.cur = cu.measures.length - 1;
    }

ACT.edadd = function (el) {
  var m = R.setup;
  var cu = S[m].custom;
  var M = METERS[cu.meter];
  var p = PAL[+el.dataset.i];
  var t = tickOf(p[0], p[1], p[2]);
  var bar = cu.measures[R.ed.cur];
  if (t <= 0 || sumT(bar) + t > M.cap) {
    return;
  }
  bar.push({ t: t, r: R.ed.rest ? 1 : 0 });
  if (S.prefs.sound && !R.ed.rest && A.unlock()) {
    A.perc(A.now(), S.prefs.inst);
  }

  persist();
  render();
};
ACT.edundo = function () {
  var m = R.setup;
  var cu = S[m].custom;
  var i = R.ed.cur;
  if (!cu.measures[i].length) {
    for (var k = cu.measures.length - 1; k >= 0; k--) {
      if (cu.measures[k].length) {
        i = k;
        break;
      }
    }
  }
  if (cu.measures[i].length) {
    R.ed.cur = i;
    cu.measures[i].pop();
    persist();
    render();
  }

/* --- pitch editor --- */
function spell(m) {
  var s = m % 12;
  var oct = Math.floor(m / 12) - 1;
  var i = SEMI.indexOf(s);
  if (i >= 0) {
    return { d: 7 * oct + i, alt: 0 };
  }
  var flat = keyById(S.pitch.key).n < 0;
  if (flat) {
    var j = SEMI.indexOf(s + 1);
    return { d: 7 * oct + j, alt: -1 };
  }
  var k = SEMI.indexOf(s - 1);
  return { d: 7 * oct + k, alt: 1 };
}
function pitchEdRange() {
  var c = S.pitch;
  var ds = c.custom
    .map(function (n) {
      return n.d;
    })
    .concat([c.lo, c.hi]);
  return { lo: Math.min.apply(null, ds) - 1, hi: Math.max.apply(null, ds) + 1 };
}

function drawPitchEd() {

  if (!k || !R.edit) {
    return;
  }
  var m = +k.dataset.m;
  A.unlock();
  if (S.prefs.sound) {
    A.tone(m, A.now() + 0.005, 0.6, 0.45);
  }
  kbdFlash($('edkbd'), m, 'down', 240);
  if (R.setup === 'pitch') {
    if (S.pitch.custom.length >= 60) {
      toast('60 notes is the maximum');
      return;
    }
    S.pitch.custom.push(spell(m));
    persist();
    drawPitchEd();

    R.ed.root = m;
    earEdMarks();
  }
});
ACT.pedundo = function () {
  S.pitch.custom.pop();

};
ACT.pedclear = function () {
  S.pitch.custom = [];

  drawPitchEd();

ACT.pedrand = function () {
  var c = S.pitch;
  var g = genPitch({
    clef: c.clef,
    key: c.key,
    minor: c.minor,
    harm: c.harm,
    lo: c.lo,
    hi: c.hi,
    count: Math.min(8, 60 - c.custom.length),
    leap: c.leap,
    acc: c.acc,

    A.seq(
      [67, 71, 74, 72].map(function (m, i) {

var Met = { run: false, timer: 0, next: 0, beat: 0, sub: 0, q: [], bars: 0, taps: [], raf: 0 };
function tempoName(b) {
  for (var i = 0; i < TEMPO.length; i++) {
    if (b < TEMPO[i][0]) {
      return TEMPO[i][1];
    }
  }
  return 'Prestissimo';
}
/* Beat settings group of the metronome page */
function metBeatGroup(T) {
  var h = '';
  h += grp(
    'Beat',
    rStep('Beats per bar', 'tools', 'mbeats', T.mbeats, T.mbeats) +
      rStep(
        'Subdivisions per beat',
        'tools',
        'msub',
        T.msub,
        T.msub === 1 ? '1 · none' : String(T.msub),
        '1 to 16 clicks inside every beat'
      ) +

        'Sound',
        'tools',
        'msnd',
        [
          ['click', 'Click'],
          ['wood', 'Wood'],

        ],

      ) +

  );

}
/* Tempo trainer group of the metronome page */
function metTrainerGroup(T) {
  var h = '';
  h += grp(
    'Tempo trainer',
    rSw(
      'Speed up gradually',
      'tools',
      'mtr',
      T.mtr,
      'Raises the tempo every few bars while it plays'
    ) +
      (T.mtr
        ? rStep('Add', 'tools', 'mtrstep', T.mtrstep, '+' + T.mtrstep + ' BPM') +
          rStep('Every', 'tools', 'mtrbars', T.mtrbars, T.mtrbars + ' bars') +
          rStep('Up to', 'tools', 'mtrmax', T.mtrmax, T.mtrmax + ' BPM')
        : '')
  );

}
function metPage() {
  var T = S.tools;
  var h = toolNav('Metronome');
  var dots = '';
  for (var i = 0; i < T.mbeats; i++) {
    dots += '<i class="' + (i === 0 && T.macc ? 'acc' : '') + '"></i>';
  }
  h +=
    '<div class="group metbig"><div class="bpmrow"><button type="button" class="bpmb" aria-label="Slower by 10" data-act="metb" data-d="-10">−10</button><button type="button" class="bpmb" aria-label="Slower" data-act="metb" data-d="-1">−</button><div class="bpmv"><b id="mbpm">' +
    T.mbpm +

    '<input type="range" id="mrng" min="1" max="500" step="1" value="' +

    '" aria-label="Tempo in beats per minute"><div class="mdots" id="mdots" aria-hidden="true">' +
    dots +
    '</div>' +
    '<div class="metbtns"><button type="button" class="bigplay" id="mgo" data-act="metgo">' +
    (Met.run ? IC.x + 'Stop' : IC.play + 'Start') +

  h += metBeatGroup(T);
  h += metTrainerGroup(T);
  return h;
}
function metSched() {
  var T = S.tools;
  var lim = A.now() + 0.12;
  while (Met.next < lim) {
    var main = Met.sub === 0;
    var hi = Met.beat === 0 && main && T.macc;
    A.mclick(Met.next, T.msnd, hi ? 1 : main ? 0.7 : 0.3, hi, main && !hi);
    Met.q.push({ t: Met.next, b: Met.beat, s: Met.sub });
    Met.next += 60 / T.mbpm / T.msub;
    Met.sub++;
    if (Met.sub >= T.msub) {
      Met.sub = 0;
      Met.beat++;
      if (Met.beat >= T.mbeats) {
        Met.beat = 0;
        Met.bars++;
        if (T.mtr && Met.bars % T.mtrbars === 0 && T.mbpm < T.mtrmax) {
          T.mbpm = Math.min(T.mtrmax, T.mbpm + T.mtrstep);
          persist();
        }
      }
    }
  }
}
function metDraw() {
  if (!Met.run) {
    return;
  }
  var now = A.now();
  var ds = $('mdots');
  while (Met.q.length && Met.q[0].t <= now) {
    var e = Met.q.shift();
    if (e.s === 0 && ds) {
      Array.prototype.forEach.call(ds.children, function (d, i) {
        d.classList.toggle('on', i === e.b);
      });
    }
  }
  var b = $('mbpm');
  if (b && b.textContent !== String(S.tools.mbpm)) {
    b.textContent = S.tools.mbpm;
    var r = $('mrng');
    if (r) {
      r.value = S.tools.mbpm;
    }
    var n = $('mname');
    if (n) {
      n.textContent = tempoName(S.tools.mbpm) + ' · BPM';
    }
  }
  Met.raf = requestAnimationFrame(metDraw);
}
function metStart() {
  if (!A.unlock()) {
    return;
  }
  if (S.prefs.sound === false) {
    toast('Sound is off. Turn it on in Settings.');
    return;
  }
  Met.run = true;
  Met.next = A.now() + 0.12;
  Met.beat = 0;
  Met.sub = 0;
  Met.q = [];
  Met.bars = 0;
  clearInterval(Met.timer);
  Met.timer = setInterval(metSched, 25);
  cancelAnimationFrame(Met.raf);
  Met.raf = requestAnimationFrame(metDraw);
  var g = $('mgo');
  if (g) {
    g.innerHTML = IC.x + 'Stop';
  }
}
function metStop() {
  if (!Met.run) {
    return;
  }
  Met.run = false;
  clearInterval(Met.timer);
  cancelAnimationFrame(Met.raf);
  Met.q = [];
  var g = $('mgo');
  if (g) {
    g.innerHTML = IC.play + 'Start';
  }
  var ds = $('mdots');
  if (ds) {
    Array.prototype.forEach.call(ds.children, function (d) {
      d.classList.remove('on');
    });
  }
}
ACT.metgo = function () {
  if (Met.run) {
    metStop();
  } else {
    metStart();
  }
};
ACT.metb = function (el) {
  S.tools.mbpm = clamp(S.tools.mbpm + +el.dataset.d, 1, 500);
  persist();
  var b = $('mbpm');
  if (b) {
    b.textContent = S.tools.mbpm;
  }

  }

ACT.mtap = function () {
  var n = Date.now();
  var t = Met.taps;
  if (t.length && n - t[t.length - 1] > 2200) {
    Met.taps = t = [];
  }
  t.push(n);
  if (t.length > 6) {
    t.shift();
  }
  if (t.length >= 2) {
    var s = 0;
    for (var i = 1; i < t.length; i++) {
      s += t[i] - t[i - 1];
    }
    var bpm = Math.round(60000 / (s / (t.length - 1)));
    S.tools.mbpm = clamp(bpm, 1, 500);
    persist();
    var b = $('mbpm');
    if (b) {
      b.textContent = S.tools.mbpm;
    }
    var r = $('mrng');
    if (r) {
      r.value = S.tools.mbpm;
    }
    var nm = $('mname');
    if (nm) {
      nm.textContent = tempoName(S.tools.mbpm) + ' · BPM';
    }
  }
};

    SCIDS.forEach(function (id) {
      var set = SC[id].iv.map(function (s) {
        return (r + s) % 12;

      if (
        !pcs.every(function (p) {
          return set.indexOf(p) >= 0;
        })

        return;

        'Harmonic Minor': 0.6,
        'Melodic Minor': 0.8,
        Blues: 0.6

        root: r,
        id: id,

ACT.trrec = function () {

function trAnalyze(x, sr, auto) {
  var t = TS.tr;
  var T = S.tools;
  t.state = 'busy';
  t.msg = 'Listening to your recording…';
  t.prog = 0;
  t.err = '';
  render();
  if (x.length / sr < 0.3) {
    t.state = 'idle';
    t.err = 'That was too short. Try again.';
    render();
    return;
  }
  analyzeBest(x, sr, T.trrange, {
    cb: function (p) {
      t.prog = Math.round(p * 100);
      var e = $('trprog');
      if (e) {
        e.style.width = t.prog + '%';
      }

    .then(function (rr) {
      var notes = rr.notes;

      if (!notes.length) {

        render();
        return;

      t.raw = notes;
      if (auto) {
        T.trbpm = clamp(guessTempo(notes), 40, 200);

      trBuild();
      t.state = 'done';
      render();

ACT.trplay = function () {

  if (!end) {
    return;

  TS.playing = true;
  var b = document.querySelector('.playtog');
  if (b) {
    b.classList.add('on');
    b.querySelector('span').textContent = 'Stop';
  }
  var pos = 0;
  var prev = null;
  t.bars.forEach(function (bar) {
    bar.forEach(function (tk) {
      var at = secOf(pos, S.tools.trbpm);

    function () {

        prev.classList.remove('cur');

function jamDia(J) {

    var r = (J.key + iv[i]) % 12;
    var t = (iv[(i + 2) % 7] - iv[i] + 12) % 12;
    var f = (iv[(i + 4) % 7] - iv[i] + 12) % 12;

    var id;

            ? s === 10
              ? 'm7b5'
              : 'dim7'
            : 'm7';

    }
    var rn = '';
    try {
      rn = romanOf((r - J.key + 12) % 12, id, J.pm === 'minor');
    } catch (e) {}

  }

    g.miss[tokName(e.t, 0)] = 1;
  }
  recordItem(itemId('rhythm', e.t, 0), w >= 0.85, err === null ? 0 : Math.abs(err));
  g.tok[e.mi][e.ti] = cls;
  g.lab[e.mi][e.ti] = { t: text, cls: cls };
  g.sum += w;
  if (cls !== 'st-perfect') {
    g.items.push({
      sec: e.sec,

/* tap result: record unmatched taps as extras; returns {extras, extraList} */
function tapCollectExtras(g, ex, M) {
  var extras = 0;
  var extraList = [];
  P.taps.forEach(function (t, i) {
    if (!g.used[i] && t >= P.tEx - 0.2) {
      extras++;
      var tick = clamp((t - P.tEx) / P.tickSec, 0, P.total - 1);
      var mi = Math.min(ex.measures.length - 1, Math.floor(tick / M.cap));
      extraList.push({ mi: mi, tick: tick - mi * M.cap });
      g.items.push({
        sec: t,
        cls: 'extra',
        pos: 'Bar ' + (mi + 1) + ' · ' + beatLabel(M, tick - mi * M.cap),
        what: 'Extra tap'

}
/* tap result: per-bar ok/bad class */
function tapBarClasses(ex, tok) {
  return ex.measures.map(function (m, mi) {
    var ok = 0;
    var n = 0;
    m.forEach(function (t, ti) {
      if (!t.r) {
        n++;
        if (tok[mi][ti] === 'st-perfect' || tok[mi][ti] === 'st-good') {
          ok++;

    return n && ok === n ? 'ok' : 'bad';
  });
}
/* tap result: average-timing sentence */
function tapTimingText(dts) {
  var avg = dts.length
    ? (dts.reduce(function (a, b) {
        return a + b;
      }, 0) /
        dts.length) *
      1000
    : 0;

}
/* tap result: legend markup */
function tapLegendHtml(cnt, extras) {
  return (
    '<div class="legend"><span><i style="background:var(--ok)"></i>Perfect ' +
    cnt.p +
    '</span><span><i style="background:#7BB800"></i>Close ' +
    cnt.g +
    '</span><span><i style="background:var(--warn)"></i>Early/late ' +
    cnt.o +
    '</span><span><i style="background:var(--bad)"></i>Missed ' +
    cnt.m +

/* tap result: every-mistake list markup (sorts items by time) */
function tapMistakeListHtml(items) {

    '<h3 style="font-size:17px;margin-top:4px">Every mistake</h3>' +

/* tap result: indexes of bars with errors or extra taps */
function tapBadBars(extraList) {

    var ex2 = extraList.some(function (e2) {

}
/* tap result: trouble-spot practice buttons markup ('' when no bad bars) */
function tapTroubleHtml(bad, M, ex) {

    '<h3 style="font-size:17px;margin-top:10px">Practise your trouble spots</h3><p class="hint" style="padding:0 0 8px">Tap a bar to get a new exercise built from that rhythm.</p><div class="troub">' +
    bad
      .map(function (i) {

          '<button type="button" data-act="rhprac" data-i="' +
          i +
          '">' +

          ' · Practise</b></button>'
        );
      })
      .join('') +
    (bad.length > 1
      ? '<button type="button" data-act="rhprac" data-i="all"><span>All ' +
        bad.length +

    '</div>'

}
/* tap result: per-token grid filled with a constant */
function tapBlankGrid(ex, v) {
  return ex.measures.map(function (m) {
    return m.map(function () {
      return v;
    });
  });
}
/* finish a rhythm tap session: grade taps, redraw the stage, show the result */
function finishTap() {
  var M = P.M;
  var ex = P.ex;
  var tok = tapBlankGrid(ex, '');
  var lab = tapBlankGrid(ex, null);
  var exp = tapExpected(ex, M);
  var g = {
    used: {},
    win: Math.min(0.3, P.beatSec * 0.5),
    sum: 0,
    dts: [],
    cnt: { p: 0, g: 0, o: 0, m: 0 },
    miss: {},
    items: [],
    tok: tok,
    lab: lab
  };
  exp.forEach(function (e) {
    tapGradeEvent(e, g, M);
  });
  var xr = tapCollectExtras(g, ex, M);
  var extras = xr.extras;
  var extraList = xr.extraList;
  var pct = Math.max(0, Math.round((g.sum / exp.length) * 100 - extras * 4));
  P.tokCls = tok;
  P.lab = lab;
  P.extraList = extraList;
  P.resCls = tapBarClasses(ex, tok);
  P.done = true;
  P.redraw();
  var timing = tapTimingText(g.dts);
  var legend = tapLegendHtml(g.cnt, extras);
  var list = tapMistakeListHtml(g.items);
  var bad = tapBadBars(extraList);
  P.badBars = bad;
  list = tapTroubleHtml(bad, M, ex) + list;
  showResult({
    inline: true,
    pct: pct,
    title: P.title,
    n: exp.length,
    miss: Object.keys(g.miss),
    sub: timing,
    legend: legend,
    list: list,
    stats: function (s) {
      return [
        ['Notes', exp.length],
        ['Extra taps', extras],
        ['Tempo', P.c.bpm + ' bpm']
      ];
    }
  });
}

// ---- Mode: Dictation ----

/* dictation: pick the exercise; null (after a toast) when it cannot be built */
function dictResolveEx(opt, c) {

    !(opt && opt.items) &&
    c.mode === 'custom' &&
    !(
      c.custom.measures.length &&
      c.custom.measures.every(function (m) {
        return sumT(m) === METERS[c.custom.meter].cap;

/* dictation: redraw the answer staff */
function dictRedrawStage() {

Play.dict = {

function dUsed() {
  return sumT(P.ans.m[P.ans.cur]);
}
function dCanAdd(b) {
  var t = tickOf(b, P.ans.dot, P.ans.tri);
  return t > 0 && dUsed() + t <= P.M.cap;
}
function drefresh() {
  if (!P || P.mode !== 'dict') {
    return;
  }
  var a = P.ans;
  var btns = $('durs');
  if (!btns) {
    return;
  }
  Array.prototype.forEach.call(btns.children, function (b) {
    var k = b.dataset.b;
    b.disabled = P.done || !dCanAdd(k);
    b.innerHTML = durGlyph(k, a.dot, a.rest, a.tri) + '<span>' + NAMES[k] + '</span>';
    b.setAttribute(
      'aria-label',
      NAMES[k] + (a.dot ? ' dotted' : '') + (a.tri ? ' triplet' : '') + (a.rest ? ' rest' : '')
    );
  });

  $('btri').setAttribute('aria-pressed', String(a.tri));
  $('brest').setAttribute('aria-pressed', String(a.rest));
  var full = a.m.every(function (m) {
    return sumT(m) === P.M.cap;

  $('bcheck').disabled = !full || P.done;

    (a.m.reduce(function (s, m) {
      return s + sumT(m);

function dAfterEdit() {

    for (var k = 1; k < a.m.length; k++) {
      var j = (a.cur + k) % a.m.length;

ACT.dadd = function (el) {

    return;

  a.dot = false;
  a.rest = false;

};
ACT.ddot = function () {

ACT.dtri = function () {

ACT.dundo = function () {

  var a = P.ans;
  var i = a.cur;
  if (!a.m[i].length) {
    for (var k = a.m.length - 1; k >= 0; k--) {
      if (a.m[k].length) {
        i = k;
        break;
      }
    }
  }
  if (a.m[i].length) {
    a.cur = i;
    a.m[i].pop();
    a.res[i] = null;
    if (a.tok) {
      a.tok[i] = null;

};
ACT.dclear = function () {

document.addEventListener('click', function (e) {

ACT.dlisten = function () {
  if (!P || P.mode !== 'dict') {
    return;
  }
  if (P.playing) {
    stopListen();
    return;
  }
  if (!A.unlock()) {
    $('dstat').textContent = 'Audio is not available in this browser';
    return;
  }
  var M = P.M;
  var c = P.c;
  var tickSec = 60 / c.bpm / M.beat;
  var t0 = A.now() + 0.25;
  var ex = P.ex;
  for (var b = 0; b < M.beats; b++) {
    A.click(t0 + b * M.beat * tickSec, b === 0);
  }
  var tEx = t0 + M.cap * tickSec;
  ex.measures.forEach(function (m, mi) {
    var pos = 0;
    m.forEach(function (t) {
      if (!t.r) {
        A.hold(tEx + (mi * M.cap + pos) * tickSec, t.t * tickSec, 0.55);
      }
      pos += t.t;
    });
    if (c.click) {

/* score each note/rest: right when the same value starts at the same place */
function dictScore() {
  var a = P.ans;
  var tot = 0;
  var ok = 0;
  var flags = [];
  var miss = {};
  var expected = [];
  P.ex.measures.forEach(function (ex, i) {
    var exp = {};
    var p = 0;
    ex.forEach(function (t) {
      exp[p] = t;
      p += t.t;
      tot++;
    });
    var fl = [];
    var q = 0;
    var hit = {};
    a.m[i].forEach(function (t) {
      var e = exp[q];
      var g = !!e && e.t === t.t && (e.r ? 1 : 0) === (t.r ? 1 : 0);
      fl.push(g);
      if (g) {
        ok++;
        hit[q] = 1;
      }
      q += t.t;
    });
    flags.push(fl);
    var p2 = 0;
    ex.forEach(function (t) {
      if (!hit[p2]) {
        miss[tokName(t.t, t.r)] = 1;
      }
      expected.push({ t: t.t, r: t.r ? 1 : 0, hit: !!hit[p2] });
      p2 += t.t;
    });
  });
  return {
    tot: tot,
    ok: ok,
    flags: flags,
    expected: expected,
    miss: Object.keys(miss),
    pct: tot ? Math.round((100 * ok) / tot) : 0

}

  a.res = P.ex.measures.map(function (ex, i) {

}
ACT.dcheck = function () {

  P.redraw();
  if (sc.ok === sc.tot) {
    finishDict(100, [], false, sc);
    return;
  }
  $('dver').innerHTML =
    '<div class="dverdict"><span><b>' +
    sc.ok +
    ' of ' +
    sc.tot +
    ' notes right.</b> Green is right, red is wrong. Fix the red ones, then check again.</span><span class="btns"><button type="button" class="btn" data-act="dreveal">Show answer</button></span></div>';

function earItems() {

    return c.sel[c.type].indexOf(i[0]) >= 0;
  });

function earItem(type, id) {
  var l = EAR[type].items;

    if (l[i][0] === id) {
      return l[i];
    }

/* ear events: interval (ascending, descending or together) */
function earBuildInterval(it, root, dir) {
  var hi = root + it[2][1];

  if (dir === 'asc') {
    ev = [
      { m: [root], at: 0, dur: 1 },
      { m: [hi], at: 0.85, dur: 1.2 }
    ];
  } else if (dir === 'desc') {
    ev = [
      { m: [hi], at: 0, dur: 1 },
      { m: [root], at: 0.85, dur: 1.2 }
    ];
  } else {
    ev = [{ m: [root, hi], at: 0, dur: 1.8 }];

}

      .map(function (m, i) {
        return { m: [m], at: i * 0.32, dur: 1.6 - i * 0.2 };
      })
      .concat([{ m: notes, at: notes.length * 0.32 + 0.2, dur: 1.3 }]);

}
/* ear events: scale played note by note */
function earBuildScale(it, root, dir) {
  var notes = it[2].map(function (s) {

}
/* ear events: solfege degree (tonic then note, or cadence then note) */
function earBuildDegree(it, root, oct, preview) {
  var ev;
  var tgt = root + it[2][0] + oct;

/* ---- Self-check (open the page with ?test) ----
   Runs against throw-away state; the real save and state are restored afterwards.
   Results are logged to the console and shown in a panel. */
function runSelfTest() {
  var results = [];
  function check(name, cond) {
    results.push({ name: name, ok: !!cond });
  }
  var keepS = S;
  var keepP = P;
  var keepCloud = cloudRef;
  var keepStore = null;
  try {
    keepStore = localStorage.getItem(STORE);
  } catch (e) {}
  cloudRef = null;
  try {
    testNoteMath(check);
    testSaveLoad(check);
    testSyncMerge(check);
    testScoring(check);
    testTotals(check);
    testItems(check);
    testBackup(check);
    testStreakRules(check);
    testReferencePitch(check);
    testAdaptive(check);
    testMidiAnswers(check);
  } catch (e) {
    check('no exception: ' + e.message, false);
  }
  S = keepS;
  P = keepP;
  cloudRef = keepCloud;
  try {
    if (keepStore === null) {
      localStorage.removeItem(STORE);
    } else {
      localStorage.setItem(STORE, keepStore);
    }
  } catch (e) {}
  showSelfTest(results);
  return results;
}
/* Empty saved data, then load: the same as a first visit. */
function freshState() {
  try {
    localStorage.removeItem(STORE);
  } catch (e) {}
  loadSaved();
}
function testNoteMath(check) {
  check('midiName(60) is C4', midiName(60) === 'C4');
  check('midiName(69) is A4', midiName(69) === 'A4');
  check('freq(69) is 440', Math.abs(freq(69) - 440) < 1e-9);
  check('freq(57) is 220', Math.abs(freq(57) - 220) < 1e-9);
  check('dMidi C4 is 60', dMidi({ d: 28, alt: 0 }) === 60);
  check('dMidi C#4 is 61', dMidi({ d: 28, alt: 1 }) === 61);
  check('dName C4', dName({ d: 28, alt: 0 }) === 'C4');
  check('keyAlts(2) has two sharps', keyAlts(2).filter(Boolean).length === 2);
  check('isBlack(61)', isBlack(61) && !isBlack(60));
}
function testSaveLoad(check) {
  loadSaved();

  S.rhythm.level = 4;
  addLog({ mode: 'pitch', score: 80, secs: 60 });

function testSyncMerge(check) {

  check('avgOf rounds', avgOf([{ score: 80 }, { score: 100 }, {}]) === 60);

/* Permanent totals must stay right after the raw log is trimmed (1,200 sessions). */
function testTotals(check) {
  freshState();
  var now = Date.now();
  var secs = 0;
  var score = 0;
  for (var i = 0; i < 1200; i++) {
    var e = { mode: MODE_ORDER[i % 4], score: i % 101, secs: 30 + (i % 7) * 10 };
    addLog(e);
    secs += e.secs;
    score += e.score;
  }
  var t = totals();
  check('raw log is capped at 400', S.log.length === LOG_CAP);
  check('history keeps all 1200 sessions', S.hist.length === 1200 && t.all.n === 1200);
  check('all-time seconds are exact', t.all.s === secs);
  check('all-time average is exact', tallyAvg(t.all) === Math.round(score / 1200));
  check(
    'per-mode totals add up',
    MODE_ORDER.reduce(function (n, m) {
      return n + t.modes[m].n;
    }, 0) === 1200
  );
  check('per-day totals add up', t.days[dayKey(now)] && t.days[dayKey(now)].n === 1200);
  var sorted = JSON.parse(localStorage.getItem(STORE));
  check('saved copy keeps the history', sorted.hist.length === 1200);
  S.log = [];
  S.hist = [];
  S.log.push({ id: 'old1', mode: 'ear', at: now - 5 * 864e5, secs: 120, score: 70 });
  histSync();
  check('old logs migrate into the totals', totals().modes.ear.n === 1 && totals().all.s === 120);
  histSync();
  check('migration never double counts', S.hist.length === 1);
}

function dayList(now, backs) {
  var days = {};
  backs.forEach(function (n) {
    var d = new Date(now);
    d.setDate(d.getDate() - n);
    days[dayKey(d)] = 1;
  });
  return days;
}
function testStreakRules(check) {
  var wed = new Date(2026, 9, 28, 12); // Wednesday
  check('weekKey is the Monday', weekKey(wed) === '2026-10-26');
  check('plain streak', streakInfo(dayList(wed, [0, 1, 2]), wed, true).n === 3);
  check('empty today does not break', streakInfo(dayList(wed, [1, 2]), wed, true).n === 2);
  var gap = dayList(wed, [0, 2, 3]);
  check('one rest day bridges a gap', streakInfo(gap, wed, true).n === 3);
  check('no rest day: gap breaks it', streakInfo(gap, wed, false).n === 1);
  check('rest day is reported', streakInfo(gap, wed, true).restUsed['2026-10-26'] === true);
  var fri = new Date(2026, 9, 30, 12);
  check('only one rest day per week', streakInfo(dayList(fri, [0, 2, 4]), fri, true).n === 2);
  var nextWeek = dayList(new Date(2026, 10, 4, 12), [0, 2, 4]);
  check(
    'a new week gets a new rest day',
    streakInfo(nextWeek, new Date(2026, 10, 4, 12), true).n === 3
  );
  check('two missed days in a row break it', streakInfo(dayList(wed, [0, 3]), wed, true).n === 1);
  freshState();
  S.log = [];
  [0, 1, 3, 4, 5].forEach(function (back) {
    S.log.push({
      id: 'w' + back,

}

}
function testAdaptive(check) {
  var now = Date.now();
  var weak = { n: 10, ok: 3, t: now - 864e5, ms: 0, mn: 0, r: '00100100' };
  var strong = { n: 10, ok: 10, t: now - 1000, ms: 0, mn: 0, r: '11111111' };
  check('missed items weigh more', earWeight(weak, now) > 4 * earWeight(strong, now));
  check('unseen items get a normal weight', earWeight(null, now) === 1);
  var stale = { n: 4, ok: 4, t: now - 9 * 864e5, ms: 0, mn: 0, r: '1111' };
  var fresh = { n: 4, ok: 4, t: now - 1000, ms: 0, mn: 0, r: '1111' };
  check('items not seen for a week weigh more', earWeight(stale, now) > earWeight(fresh, now));
  freshState();
  P = { type: 'interval', items: EAR.interval.items.slice(0, 3), lastItem: null };
  var first = P.items[0][0];
  S.items[itemId('ear', 'interval', first)] = weak;
  S.items[itemId('ear', 'interval', P.items[1][0])] = strong;
  S.items[itemId('ear', 'interval', P.items[2][0])] = strong;
  var count = {};
  for (var i = 0; i < 2000; i++) {
    var it = earPickAdaptive();
    count[it[0]] = (count[it[0]] || 0) + 1;
    P.lastItem = null;
  }
  check('adaptive pick favours the weak item', count[first] > 2 * (count[P.items[1][0]] || 0));
  check('adaptive pick still asks the others', count[P.items[1][0]] > 0);
}

  );
}
function showSelfTest(results) {
  var bad = results.filter(function (r) {
    return !r.ok;
  });
  var lines = results.map(function (r) {
    return (r.ok ? 'PASS ' : 'FAIL ') + r.name;
  });
  lines.push('', results.length - bad.length + '/' + results.length + ' passed');
  console.log(lines.join('\n'));
  var box = document.createElement('pre');
  box.id = 'selftest';
  box.setAttribute(
    'style',
    'position:fixed;inset:8px;z-index:99999;overflow:auto;margin:0;padding:12px;background:#111;color:#eee;font:12px/1.4 monospace;border-radius:10px'
  );
  box.textContent = lines.join('\n');
  document.body.appendChild(box);
}

/* Start the app: load the save, build lookup tables, draw, start cloud sync. */
function boot() {
  loadSaved();
  buildEdgeTables();
  buildChordTables();
  applyTheme();
  render();
  startCloud();
  if (S.prefs.midi) {
    midiEnable();
  }
  if (window.matchMedia) {
    try {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && P && P.mode === 'dict' && P.playing) {
      stopListen();
    }
    if (document.hidden) {
      wakeRelease();
    } else {
      wakeUpdate();
    }
  });
  setInterval(wakeUpdate, 1000);
  if (/[?&]test\b/.test(location.search)) {
    runSelfTest();
  }
}
