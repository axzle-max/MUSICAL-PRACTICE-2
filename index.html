};
ACT.ddot=function(){if(!P||P.done)return;P.ans.dot=!P.ans.dot;if(P.ans.dot)P.ans.tri=false;drefresh();};
ACT.dtri=function(){if(!P||P.done)return;P.ans.tri=!P.ans.tri;if(P.ans.tri)P.ans.dot=false;drefresh();};
ACT.drest=function(){if(!P||P.done)return;P.ans.rest=!P.ans.rest;drefresh();};
ACT.dundo=function(){
  if(!P||P.done)return;var a=P.ans,i=a.cur;
  if(!a.m[i].length){for(var k=a.m.length-1;k>=0;k--)if(a.m[k].length){i=k;break;}}
  if(a.m[i].length){a.cur=i;a.m[i].pop();a.res[i]=null;if(a.tok)a.tok[i]=null;P.redraw();}
};
ACT.dclear=function(){if(!P||P.done)return;P.ans.m[P.ans.cur]=[];P.ans.res[P.ans.cur]=null;if(P.ans.tok)P.ans.tok[P.ans.cur]=null;P.redraw();};
document.addEventListener('click',function(e){
  var h=e.target.closest?e.target.closest('#zone .hit[data-m]'):null;if(!h||!P||P.mode!=='dict'||P.done)return;
  P.ans.cur=+h.dataset.m;P.redraw();
});
ACT.dlisten=function(){
  if(!P||P.mode!=='dict')return;
  if(P.playing){stopListen();return;}
  if(!A.unlock()){$('dstat').textContent='Audio is not available in this browser';return;}
  var M=P.M,c=P.c,tickSec=60/c.bpm/M.beat,t0=A.now()+0.25,ex=P.ex;
  for(var b=0;b<M.beats;b++)A.click(t0+b*M.beat*tickSec,b===0);
  var tEx=t0+M.cap*tickSec;
  ex.measures.forEach(function(m,mi){var pos=0;m.forEach(function(t){if(!t.r)A.hold(tEx+(mi*M.cap+pos)*tickSec,t.t*tickSec,0.55);pos+=t.t;});
    if(c.click)for(var bb=0;bb<M.beats;bb++)A.click(tEx+(mi*M.cap+bb*M.beat)*tickSec,bb===0);});
  P.playing=true;P.plays=(P.plays||0)+1;
  $('lis').querySelector('span').textContent='Stop';$('dstat').textContent='Count-in… then listen carefully';
  var dur=(M.cap*(ex.measures.length+1))*tickSec*1000+500;
  P.playT=later(function(){stopListen(true);},dur);
};
function stopListen(natural){
  if(!P||P.mode!=='dict')return;clearTimeout(P.playT);if(!natural)A.stop();P.playing=false;
  var l=$('lis');if(l)l.querySelector('span').textContent='Listen again';
  var s=$('dstat');if(s)s.textContent='Tap a bar to select it, then choose note values.';
}
/* score each note/rest: right when the same value starts at the same place */
function dictScore(){
  var a=P.ans,tot=0,ok=0,flags=[],miss={};
  P.ex.measures.forEach(function(ex,i){
    var exp={},p=0;ex.forEach(function(t){exp[p]=t;p+=t.t;tot++;});
    var fl=[],q=0,hit={};
    a.m[i].forEach(function(t){var e=exp[q];var g=!!e&&e.t===t.t&&(e.r?1:0)===(t.r?1:0);fl.push(g);if(g){ok++;hit[q]=1;}q+=t.t;});
    flags.push(fl);
    var p2=0;ex.forEach(function(t){if(!hit[p2])miss[tokName(t.t,t.r)]=1;p2+=t.t;});
  });
  return {tot:tot,ok:ok,flags:flags,miss:Object.keys(miss),pct:tot?Math.round(100*ok/tot):0};
}
function dictMark(sc){
  var a=P.ans;a.tok=sc.flags.map(function(fl){return fl.map(function(g){return g?'st-perfect':'st-miss';});});
  a.res=P.ex.measures.map(function(ex,i){return sc.flags[i].length===ex.length&&sc.flags[i].every(Boolean)&&sameM(a.m[i],ex)?'ok':'bad';});
}
ACT.dcheck=function(){
  if(!P||P.done)return;var a=P.ans;a.checks++;
  var sc=dictScore();dictMark(sc);P.redraw();
  if(sc.ok===sc.tot){finishDict(100,[],false,sc);return;}
  $('dver').innerHTML='<div class="dverdict"><span><b>'+sc.ok+' of '+sc.tot+' notes right.</b> Green is right, red is wrong. Fix the red ones, then check again.</span><span class="btns"><button type="button" class="btn" data-act="dreveal">Show answer</button></span></div>';
  var w=a.res.indexOf('bad');if(w>=0&&a.res[a.cur]!=='bad'){a.cur=w;P.redraw();}
};
ACT.dreveal=function(){
  if(!P||P.done)return;var a=P.ans,sc=dictScore();dictMark(sc);
  a.revealed=true;finishDict(sc.pct,sc.miss,true,sc);
};
function finishDict(pct,miss,revealed,sc){
  P.done=true;stopListen(true);var a=P.ans;P.redraw();$('dentrywrap').style.display='none';$('dver').innerHTML='';
  showResult({inline:true,pct:pct,title:P.title,n:sc.tot,miss:miss,sub:revealed?sc.ok+' of '+sc.tot+' notes right · answer shown above':'All '+sc.tot+' notes right'+(a.checks>1?' after '+a.checks+' checks':' on the first check'),
    stats:function(s){return [['Notes',sc.ok+'/'+sc.tot],['Checks',a.checks],['Listens',P.plays||0]];}});
}

/* =============== EAR TRAINING =============== */
function earItems(){var c=S.ear,E=EAR[c.type];return E.items.filter(function(i){return c.sel[c.type].indexOf(i[0])>=0;});}
function earItem(type,id){var l=EAR[type].items;for(var i=0;i<l.length;i++)if(l[i][0]===id)return l[i];return null;}
/* builds playable events. opt.preview: for solfège just the tonic then the note */
function earBuild(type,it,root,dir,arp,oct,preview){
  var iv=it[2],ev=[],notes=[],tgt=null;
  if(type==='interval'){
    var hi=root+iv[1];notes=[root,hi];
    if(dir==='asc')ev=[{m:[root],at:0,dur:1},{m:[hi],at:0.85,dur:1.2}];
    else if(dir==='desc')ev=[{m:[hi],at:0,dur:1},{m:[root],at:0.85,dur:1.2}];
    else ev=[{m:[root,hi],at:0,dur:1.8}];
  }else if(type==='chord'){
    notes=iv.map(function(s){return root+s;});
    if(arp)ev=notes.map(function(m,i){return {m:[m],at:i*0.32,dur:1.6-i*0.2};}).concat([{m:notes,at:notes.length*0.32+0.2,dur:1.3}]);
    else ev=[{m:notes,at:0,dur:1.9}];
  }else if(type==='scale'){
    notes=iv.map(function(s){return root+s;});var seq=dir==='desc'?notes.slice().reverse():notes;
    ev=seq.map(function(m,i){return {m:[m],at:i*0.4,dur:0.42};});
  }else{
    tgt=root+iv[0]+oct;notes=[tgt];
    if(preview)ev=[{m:[root],at:0,dur:0.6},{m:[tgt],at:0.75,dur:1.1,v:0.5}];
    else{
      var chs=[[0,4,7],[5,9,12],[7,11,14],[0,4,7]];
      ev=[{m:[root-12],at:0,dur:2.4,v:0.3}];
      chs.forEach(function(ch,i){ev.push({m:ch.map(function(x){return root+x;}),at:i*0.62,dur:0.58,v:0.26});});
      ev.push({m:[tgt],at:3.0,dur:1.4,v:0.5});
    }
  }
  return {ev:ev,notes:notes,target:tgt};
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t;}return a;}
Play.ear={start:function(){
  var c=S.ear,E=EAR[c.type],items,qs=null,rounds=c.rounds;
  if(c.mode==='custom'){
    qs=c.custom.filter(function(q){return q.type===c.type&&earItem(c.type,q.id);});
    if(!qs.length){toast('Add '+E.name.toLowerCase()+' questions in the custom editor');return;}
    var ids={};qs.forEach(function(q){ids[q.id]=1;});
    items=E.items.filter(function(i){return ids[i[0]];});
    if(items.length<2){E.items.forEach(function(i){if(items.length<4&&!ids[i[0]])items.push(i);});items.sort(function(a,b){return E.items.indexOf(a)-E.items.indexOf(b);});}
    qs=shuffle(qs);rounds=qs.length;
  }else{
    items=earItems();
    if(items.length<2){toast('Choose at least two '+E.name.toLowerCase()+' to include');return;}
  }
  P={mode:'ear',type:c.type,items:items,qs:qs,n:0,rounds:rounds,right:0,miss:[],answered:false,sel:null,done:false,title:E.name+(qs?' · custom':'')};
  var grid=items.map(function(it){return '<button type="button" data-act="eans" data-v="'+esc(it[0])+'">'+esc(it[0])+'<small>'+(c.type==='degree'?it[1].split(' ')[0]:'')+'</small></button>';}).join('');
  openPlay('ear',{main:'<div class="ear-top"><div class="kbd" id="kbd"></div></div><div class="ear-mid"><div class="ear-title" id="et">Listen…</div><div class="ear-sub" id="es"></div></div>',
    foot:'<div id="earfoot"><div class="ans" id="ans" style="margin-left:auto;margin-right:auto">'+grid+'</div><div class="scoreline" id="sc"></div><div class="ear-foot"><button type="button" class="pill" data-act="erep">'+IC.repeat+'Repeat</button>'+'<button type="button" class="pill blue" id="enext" data-act="enext" disabled>Confirm</button></div></div>'},E.name+' · 1/'+rounds);
  startTimer();
  P.redraw=function(){if(P.q){earKbd();earMarkers();}};
  earNext();
}};
function earNext(){
  var c=S.ear,q,it;
  if(P.qs){var s=P.qs[P.n];it=earItem(P.type,s.id);q={item:it,root:s.root,dir:s.dir||'asc'};}
  else{it=pick(P.items);q={item:it,root:48+rnd(17),dir:c.dir};}
  if(P.type==='interval'&&q.dir==='mix')q.dir=pick(['asc','desc','harm']);
  if(P.type==='scale'&&q.dir!=='desc')q.dir='asc';
  q.oct=Math.random()<.5?0:12;
  var b=earBuild(P.type,it,q.root,q.dir,c.arp,q.oct);
  if(P.type==='degree'&&q.root+it[2][0]+q.oct>q.root+14)q.oct-=12;
  b=earBuild(P.type,it,q.root,q.dir,c.arp,q.oct);
  q.ev=b.ev;q.notes=b.notes;q.target=b.target;P.q=q;P.answered=false;P.sel=null;P.n++;
  setMid(EAR[P.type].name+' · '+P.n+'/'+P.rounds);setProg((P.n-1)/P.rounds);
  $('et').textContent='Listen…';
  $('es').textContent=c.confirm?'Tap an answer to hear it · tap again to replay':EAR[P.type].q;
  $('sc').textContent=P.right+' of '+(P.n-1)+' correct';
  Array.prototype.forEach.call($('ans').children,function(b){b.className='';b.disabled=false;});
  var nb=$('enext');nb.disabled=true;nb.textContent=c.confirm?'Confirm':(P.n>=P.rounds?'Finish':'Next');
  earKbd();earMarkers();
  later(function(){earPlay();},300);
}
function earPlay(){
  if(!P||P.mode!=='ear'||!P.q)return;A.stop();
  if(S.prefs.sound===false){$('es').textContent='Sound is off. Turn it on in Settings.';return;}
  A.seq(P.q.ev);
}
function earKbd(){
  var q=P.q,all=q.notes.slice();if(P.type==='degree'){all.push(q.root-12);all.push(q.root+14);}
  var mn=Math.min.apply(null,all),mx=Math.max.apply(null,all);
  var lo=mn-(mn%12),hi=Math.max(mx+(11-mx%12),lo+23);
  var L=kbdLayout(lo,hi),host=$('kbd');P.kL=L;host.innerHTML=kbdHtml(L,{minKey:34,names:false});
  var w=P.kL.idx[isBlack(mn)?mn-1:mn];if(w!==undefined&&host.scrollWidth>host.clientWidth)host.scrollLeft=Math.max(0,w/L.nW*host.scrollWidth-24);
}
function earMarkers(){
  var q=P.q,L=P.kL,host=$('kbd'),mk=[];
  if(P.answered){
    var seen={};
    if(P.type==='degree'){mk.push({m:q.root,cls:'grey',label:'Do'});mk.push({m:q.target,cls:'good',label:q.item[0]});}
    else q.notes.forEach(function(m){if(!seen[m]){seen[m]=1;mk.push({m:m,cls:'good',label:PCN[m%12]});}});
  }else if(S.ear.help||P.type==='interval'||P.type==='degree'){
    if(P.type==='degree')mk.push({m:q.root,cls:'grey',label:'Do'});
    else if(P.type==='interval'||S.ear.help)mk.push({m:q.notes[q.dir==='desc'&&P.type==='interval'?q.notes.length-1:0],cls:'grey',label:'Root'});
  }
  kbdMarkers(host,L,mk);
}
ACT.erep=function(){A.unlock();earPlay();};
ACT.eans=function(el){
  if(!P||P.mode!=='ear'||P.answered||P.done)return;A.unlock();
  var c=S.ear,id=el.dataset.v;
  if(!c.confirm){doEarAnswer(id);return;}
  P.sel=id;
  Array.prototype.forEach.call($('ans').children,function(b){b.classList.toggle('sel',b===el);});
  $('enext').disabled=false;
  var it=earItem(P.type,id);
  if(c.help)$('es').textContent=id+' · '+it[1]+(EARHINT[P.type][id]?' · '+EARHINT[P.type][id]:'');
  else $('es').textContent='Selected '+id+' · tap it again to replay, then Confirm.';
  earTest();
};
function earTest(){
  if(!P||P.mode!=='ear'||!P.sel||P.answered)return;
  if(S.prefs.sound===false){$('es').textContent='Sound is off. Turn it on in Settings.';return;}
  var c=S.ear,it=earItem(P.type,P.sel),q=P.q,b=earBuild(P.type,it,q.root,q.dir,c.arp,q.oct,true);A.stop();A.seq(b.ev);
}
function doEarAnswer(id){
  var q=P.q,right=id===q.item[0],c=S.ear;P.answered=true;
  if(right)P.right++;else P.miss.push(q.item[0]);
  Array.prototype.forEach.call($('ans').children,function(b){
    b.disabled=true;b.classList.remove('sel');
    if(b.dataset.v===q.item[0])b.className='right';else if(b.dataset.v===id&&!right)b.className='wrong';
  });
  $('et').textContent=q.item[1];
  var hint=EARHINT[P.type][q.item[0]];
  $('es').textContent=(right?'Correct':'Not quite · you chose '+id)+(c.help&&hint?' · '+hint:'');
  $('sc').textContent=P.right+' of '+P.n+' correct';
  earMarkers();setProg(P.n/P.rounds);
  var nb=$('enext');nb.disabled=false;nb.textContent=P.n>=P.rounds?'Finish':'Next';
  if(c.help&&!right&&S.prefs.sound!==false){
    var it=earItem(P.type,id),b=earBuild(P.type,it,q.root,q.dir,c.arp,q.oct,true);A.stop();var d=A.seq(b.ev);
    later(function(){if(P&&!P.dead)A.seq(q.ev);},(d+0.5)*1000);
  }
  if(c.auto)later(function(){if(P&&!P.done&&P.answered)ACT.enext();},right?900:2400);
}
ACT.enext=function(){
  if(!P||P.mode!=='ear'||P.done)return;
  if(!P.answered){if(P.sel)doEarAnswer(P.sel);return;}
  if(P.n>=P.rounds){
    var pct=Math.round(P.right/P.rounds*100),cnt={};P.miss.forEach(function(x){cnt[x]=1;});
    var E=EAR[P.type];
    $('et').textContent='Finished';$('es').textContent='';
    showResult({pct:pct,title:P.title,n:P.rounds,miss:Object.keys(cnt).map(function(x){return E.name.replace(/s$/,'')+': '+x;}),sub:P.right+' of '+P.rounds+' correct',
      stats:function(s){return [['Correct',P.right+'/'+P.rounds],['Time',fmtTime(s)],['Avg / question',Math.round(s/P.rounds)+' s']];}});
    return;
  }
  earNext();
};

/* ===== boot ===== */
applyTheme();
render();
startCloud();
if(window.matchMedia){try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);}catch(e){}}
document.addEventListener('visibilitychange',function(){if(document.hidden&&P&&P.mode==='dict'&&P.playing)stopListen();});

})();
</script>
