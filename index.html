<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
<title>Sight and Sound</title>
<style>
/* Layout: one fixed-height app. Tab bar at the bottom in portrait, a left rail in landscape and on iPad.
   Practice > mode screen (preview + grouped settings + big Play) > full-screen play > result.
   Play screens replace the whole shell, so nothing ever sits on top of anything else (sheets are the only modals).
   Palette: iOS grouped greys, white cards, system blue for selection, one mint-green Play button. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F2F2F7; --ink:#0B0B0F; --muted:#6B6B73; --sep:rgba(60,60,67,.16);
  --blue:#007AFF; --blue-soft:rgba(0,122,255,.12); --play:#1F9D6A; --play-ink:#FFFFFF;
  --ok:#2E9E4F; --bad:#E5352B; --warn:#D98200; --extra:#8E44C8; --range:#FFE94A; --staff:#0B0B0F;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 18px -8px rgba(0,0,0,.25); --pillbg:#FFFFFF;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",system-ui,Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --ink:#F5F5F7; --muted:#9A9AA2; --sep:rgba(84,84,88,.55);
    --blue:#0A84FF; --blue-soft:rgba(10,132,255,.22); --play:#32D583; --play-ink:#04210F;
    --ok:#4CD27A; --bad:#FF6259; --warn:#FFB340; --extra:#C58BFF; --range:#8A7A10; --staff:#E9E9EE;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px -8px rgba(0,0,0,.7); --pillbg:#2C2C2E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --ink:#F5F5F7; --muted:#9A9AA2; --sep:rgba(84,84,88,.55);
  --blue:#0A84FF; --blue-soft:rgba(10,132,255,.22); --play:#32D583; --play-ink:#04210F;
  --ok:#4CD27A; --bad:#FF6259; --warn:#FFB340; --extra:#C58BFF; --range:#8A7A10; --staff:#E9E9EE;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px -8px rgba(0,0,0,.7); --pillbg:#2C2C2E; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 var(--font);-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
textarea,input{-webkit-user-select:text;user-select:text}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
svg{display:block}
.ico{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.fill{fill:currentColor;stroke:none}

/* ---------- shell ---------- */
#app{position:relative;height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;min-width:0}
#shell{display:contents}
.views{min-height:0;min-width:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;position:relative}
.tabbar{display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);border-top:1px solid var(--sep);padding:0 max(8px,env(safe-area-inset-left,0px)) 0 max(8px,env(safe-area-inset-right,0px))}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;padding:6px 2px 4px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:600}
.tab .ico{width:25px;height:25px}
.tab[aria-selected="true"]{color:var(--blue)}
@media (orientation:landscape) and (max-height:620px),(min-width:900px){
  #app{grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
  .tabbar{order:-1;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--sep);padding:10px 8px 10px max(8px,env(safe-area-inset-left,0px));width:calc(84px + env(safe-area-inset-left,0px))}
  .tab{flex:none;min-height:60px;border-radius:12px}
  .tab[aria-selected="true"]{background:var(--blue-soft)}
}
.page{max-width:980px;margin:0 auto;padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));display:grid;gap:18px;align-content:start;min-width:0}
.nav{display:flex;align-items:center;gap:8px;min-height:44px}
.nav .grow{flex:1;min-width:0}
.back{display:inline-flex;align-items:center;gap:2px;border:0;background:none;color:var(--blue);font-size:17px;font-weight:500;min-height:44px;padding:0 8px 0 0;margin-left:-6px}
.back .ico{width:26px;height:26px;stroke-width:2.6}
.large{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.title{font-size:20px;font-weight:700;text-align:center}
.cap{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:0 16px 6px}
.foot{font-size:13px;color:var(--muted);padding:6px 16px 0}

/* ---------- grouped lists ---------- */
.group{background:var(--card);border-radius:14px;overflow:hidden;min-width:0}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;position:relative;width:100%;border:0;background:none;text-align:left;font-size:17px}
.row+.row::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--sep)}
.row .lab{flex:1;min-width:0}
.row .lab small{display:block;color:var(--muted);font-size:13px;font-weight:400;margin-top:1px}
.row .val{color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0;text-align:right}
.row .val span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .chev{width:9px;height:9px;border-right:2.4px solid var(--muted);border-top:2.4px solid var(--muted);transform:rotate(45deg);margin-left:2px;opacity:.6;flex:none}
button.row:active{background:var(--sep)}
.seg{display:inline-flex;background:var(--card2);border-radius:9px;padding:2px;gap:2px;min-width:0;max-width:100%}
.group .seg{background:color-mix(in srgb,var(--muted) 16%,transparent)}
.seg button{border:0;background:none;min-height:32px;padding:0 12px;border-radius:7px;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;flex:1 1 auto}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.22)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366}}
.row .seg{flex:none}
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;z-index:2;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:99px;background:color-mix(in srgb,var(--muted) 35%,transparent);transition:background .15s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .15s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:3px solid var(--blue);outline-offset:2px}
.step{display:inline-flex;align-items:center;gap:2px;background:var(--card2);border-radius:9px;overflow:hidden}
.group .step{background:color-mix(in srgb,var(--muted) 16%,transparent)}
.step button{width:44px;height:34px;border:0;background:none;font-size:22px;font-weight:500;line-height:1}
.step output{min-width:54px;text-align:center;font:600 17px var(--mono);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--blue);min-height:34px}
.rowfull{display:grid;gap:8px;padding:10px 16px 12px}
.rowfull+.row::before,.row+.rowfull::before{content:"";position:absolute}
.rowfull{position:relative}
.rowfull+.row::before{left:16px;right:0;top:0;height:1px;background:var(--sep)}

/* ---------- buttons ---------- */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 26px;border-radius:999px;border:0;background:var(--pillbg);box-shadow:var(--shadow);font-size:20px;font-weight:600}
.pill:active:not(:disabled){transform:scale(.97)}
.pill:disabled{opacity:.4}
.pill.blue{background:var(--blue);color:#fff}
.pill.green{background:var(--play);color:var(--play-ink)}
.pill.sm{min-height:44px;font-size:17px;padding:0 20px}
.pill.on{background:var(--blue);color:#fff}
.bigplay{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;width:100%;border:0;border-radius:18px;background:var(--play);color:var(--play-ink);font-size:21px;font-weight:700;box-shadow:var(--shadow)}
.bigplay:active{transform:scale(.985)}
.bigplay .ico{width:26px;height:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:0;background:var(--card);font-size:16px;font-weight:600;color:var(--blue)}
.btn.fill{background:var(--blue);color:#fff}
.btn.danger{color:var(--bad)}
.btn.line{background:transparent;border:1px solid var(--sep)}
.link{border:0;background:none;color:var(--blue);font-size:16px;font-weight:500;padding:8px 4px;min-height:44px}
.chip{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:99px;background:var(--card2);font:600 13px var(--mono);color:var(--muted)}
.chip.blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- home ---------- */
.homehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hbtns{display:flex;align-items:center;gap:10px}
.soundpill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--sep);background:var(--card);font-size:16px;font-weight:600}
.soundpill .ico{width:22px;height:22px}
.goal{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 4px 0 10px;border-radius:999px;border:0;background:var(--card);box-shadow:var(--shadow)}
.goal b{font:700 15px var(--mono);font-variant-numeric:tabular-nums}
.ringsvg{width:34px;height:34px;transform:rotate(-90deg)}
.ringsvg circle{fill:none;stroke-width:5}
.ringsvg .bg{stroke:var(--sep)}
.ringsvg .fg{stroke:var(--blue);stroke-linecap:round;transition:stroke-dashoffset .4s}
.cont{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;background:var(--play);color:var(--play-ink);border-radius:18px;padding:14px 18px;border:0;width:100%;text-align:left;box-shadow:var(--shadow)}
.cont .ico{width:34px;height:34px}
.cont b{font-size:20px;display:block}
.cont span{opacity:.9;font-size:14px}
.modes{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.mode{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;min-height:92px;padding:14px 16px;border:0;border-radius:18px;background:var(--card);text-align:left;box-shadow:var(--shadow);width:100%}
.mode:active{transform:scale(.99)}
.mode .tile{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;background:var(--t);color:var(--c)}
.mode .tile svg{width:44px;height:44px}
.mode h3{font-size:19px;font-weight:700;letter-spacing:-.01em}
.mode p{font-size:14px;color:var(--muted);margin-top:2px}
.mode .last{font:600 12px var(--mono);color:var(--c);margin-top:4px;display:block}
.mode .chev{width:10px;height:10px;border-right:2.6px solid var(--muted);border-top:2.6px solid var(--muted);transform:rotate(45deg);opacity:.5}
.m-pitch{--c:#007AFF;--t:rgba(0,122,255,.12)} .m-rhythm{--c:#FF6B2C;--t:rgba(255,107,44,.14)} .m-dict{--c:#AF52DE;--t:rgba(175,82,222,.14)} .m-ear{--c:#1F9D6A;--t:rgba(31,157,106,.14)}
.hint{font-size:14px;color:var(--muted)}

/* ---------- mode setup ---------- */
.setupgrid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);min-width:0}
@media (min-width:760px){ .setupgrid{grid-template-columns:minmax(220px,300px) minmax(0,1fr)} }
@media (min-width:760px) and (min-height:520px){ .previewcol{position:sticky;top:12px;align-self:start} }
.previewcol{display:grid;gap:12px;min-width:0}
.preview{background:var(--card);border-radius:14px;padding:14px;display:grid;gap:8px;justify-items:center;min-width:0}
.preview svg{width:100%;height:auto;max-height:230px}
.preview .pl{font-size:14px;color:var(--muted);text-align:center}
.settingscol{display:grid;gap:18px;min-width:0}
.playbar{padding:10px max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 94%,transparent);border-top:1px solid var(--sep)}
.playbar .bigplay{max-width:520px;margin:0 auto}
.playcol{display:none}
@media (min-width:1000px) and (min-height:520px){
  .setupgrid{grid-template-columns:minmax(220px,280px) minmax(0,1fr) 150px}
  .playcol{display:block;position:sticky;top:12px;align-self:start}
  .playcol .bigplay{min-height:190px;flex-direction:column;border-radius:20px}
  .playcol .bigplay .ico{width:44px;height:44px}
  .playbar.mob{display:none}
}
.views.hasbar{display:grid;grid-template-rows:minmax(0,1fr) auto}
.views.hasbar>.scroll{overflow-y:auto;min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

/* ---------- sheets ---------- */
#sheetlayer{position:fixed;inset:0;z-index:100;display:none}
#sheetlayer.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);max-height:86%;background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.3);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-height:700px) and (min-width:700px){ .sheet{bottom:auto;top:50%;transform:translate(-50%,-50%);border-radius:20px;max-height:80%} }
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;min-height:56px}
.sheethead h2{font-size:18px;font-weight:700;text-align:center;flex:1}
.sheethead .link{min-width:60px}
.sheetbody{overflow-y:auto;padding:0 16px 16px;display:grid;gap:14px;align-content:start;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.opt .tick{width:22px;height:22px;stroke:var(--blue);fill:none;stroke-width:3;opacity:0}
.opt[aria-checked="true"] .tick{opacity:1}
textarea.code{width:100%;min-height:180px;border:1px solid var(--sep);border-radius:12px;background:var(--card);padding:12px;font:13px/1.45 var(--mono);resize:vertical}
pre.code{margin:0;padding:12px;border-radius:12px;background:var(--card);font:12.5px/1.45 var(--mono);overflow:auto;white-space:pre;max-height:200px;-webkit-user-select:text;user-select:text}
.msg{padding:10px 14px;border-radius:12px;background:var(--blue-soft);font-size:15px}
.msg.bad{background:color-mix(in srgb,var(--bad) 16%,transparent)}

/* range editor */
.rng{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.rngstage{position:relative;height:300px;max-width:360px;width:100%;margin:0 auto}
.rngstage svg{width:100%;height:100%}
.arrows{position:absolute;left:0;display:flex;background:var(--card);border:1px solid var(--sep);border-radius:10px;overflow:hidden;transform:translateY(-50%)}
.arrows button{width:50px;height:40px;border:0;background:none;display:grid;place-items:center}
.arrows button+button{border-left:1px solid var(--sep)}
.arrows .ico{width:22px;height:22px}

/* ---------- play screens ---------- */
#play{position:absolute;inset:0;background:var(--bg);display:none;grid-template-rows:auto minmax(0,1fr) auto;z-index:50;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#play.on{display:grid}
.pbar{display:flex;align-items:center;gap:12px;min-height:50px;padding:4px 14px;min-width:0}
.pbar .x{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;color:var(--ink);border-radius:50%;margin-left:-8px}
.pbar .x .ico{width:26px;height:26px}
.pbar .mid{flex:1;min-width:0;text-align:center;font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar .time{font:600 17px var(--mono);font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.pprog{height:3px;background:var(--sep)}
.pprog i{display:block;height:100%;width:0;background:var(--blue);transition:width .25s}
.pmain{min-height:0;display:flex;flex-direction:column;min-width:0}
.pfoot{min-width:0}

/* staff zone */
.staffzone{flex:1;min-height:0;display:flex;align-items:center;background:var(--card);border-top:1px solid var(--sep);border-bottom:1px solid var(--sep);position:relative;overflow:hidden}
.staffzone svg{display:block;width:100%;height:auto;max-height:100%}
.score .ln{stroke:var(--staff);fill:none}
.score .gl{fill:var(--staff)}
.score .nt{--nc:var(--staff)}
.score .nt .hf{fill:var(--nc)} .score .nt .hh{fill:none;stroke:var(--nc);stroke-width:2}
.score .nt .stem{stroke:var(--nc)}
.score .nt .rg{stroke:var(--nc);fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round} .score .nt .rf{fill:var(--nc)}
.score .nt .pg{fill:var(--nc)}
.score .nt .ln2{stroke:var(--nc)}
.score .beam{fill:var(--staff)}
.score .nt.cur{--nc:var(--blue)} .score .nt.ok{--nc:var(--ok)} .score .nt.bad{--nc:var(--bad)}
.score .nt.st-perfect{--nc:var(--ok)} .score .nt.st-good{--nc:#7BB800} .score .nt.st-ok{--nc:var(--warn)} .score .nt.st-miss{--nc:var(--bad)}
.score .nt.gone{opacity:0}
.score .nt{transition:opacity .3s}
.score .bn{font:600 11px var(--mono);fill:var(--muted);text-anchor:middle}
.score .ts{font:800 26px var(--font);fill:var(--staff);text-anchor:middle}
.score .hbg{fill:var(--card)}
.score .phead{stroke:var(--blue);stroke-width:2;opacity:.8}
.score .ptri{fill:var(--blue)}
.score .curbg{fill:var(--blue);opacity:.09}
.score .guide{stroke:var(--sep);stroke-width:1.5;stroke-dasharray:3 4}
.score .tapx{fill:var(--extra)}
.score .lab{font:700 11px var(--font);fill:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.score .hit{fill:transparent;cursor:pointer;pointer-events:all}
.score .mact{fill:var(--blue);opacity:.09}
.score .mbad{fill:var(--bad);opacity:.1}
.score .mok{fill:var(--ok);opacity:.1}
.score .actline{stroke:var(--blue);stroke-width:2.5;stroke-linecap:round}
.score *{pointer-events:none}
.score .hit{pointer-events:all}
.score .m{--nc:var(--staff)} .score .m.ok{--nc:var(--ok)} .score .m.bad{--nc:var(--bad)} .score .m.cor{--nc:var(--blue)}
.score .m .hf{fill:var(--nc)} .score .m .hh{fill:none;stroke:var(--nc);stroke-width:2} .score .m .stem{stroke:var(--nc);stroke-width:1.9}
.score .m .rg{stroke:var(--nc);fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round} .score .m .rf{fill:var(--nc)}
.score .m .beam{fill:var(--nc)}
.score .nt .stem{stroke-width:1.9}
.flash{position:absolute;inset:0;pointer-events:none;background:var(--bad);opacity:0}
.flash.on{animation:flash .35s}
@keyframes flash{0%{opacity:.18}100%{opacity:0}}

/* piano */
.kbd{position:relative;width:100%;height:100%;min-height:90px;background:var(--card)}
.kbd .wh{position:absolute;top:0;bottom:0;border:1px solid var(--sep);border-top:0;background:#fff;border-radius:0 0 8px 8px;padding:0;display:flex;align-items:flex-end;justify-content:center;color:#111;font-size:clamp(14px,2.6vw,20px);font-weight:500;padding-bottom:10px;touch-action:manipulation}

.chipb[aria-pressed="true"]{background:var(--blue);color:#fff;box-shadow:none}
.showcard{padding:12px 14px;display:grid;gap:10px}
.showhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.showhead h3{margin:0;font-size:20px}
.showinfo{color:var(--muted);font-size:14px}
.showopts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fbwrap{width:100%;display:flex;justify-content:center}
.fbscroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
svg.fb{display:block;touch-action:manipulation}
svg.fb *{pointer-events:none}
svg.fb .cell{fill:transparent;pointer-events:all;cursor:pointer}
.fbbd{fill:#D9B77E} :root[data-theme="dark"] .fbbd{fill:#6A4F2A}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .fbbd{fill:#6A4F2A}}
.fbnut{stroke:#222;stroke-width:5} .fbfret{stroke:#8d7a55;stroke-width:1.5}
.fbin{fill:rgba(0,0,0,.14)} .fbnum{fill:var(--muted);font:600 11px var(--font);text-anchor:middle}
.fbstr{stroke:#7b7b7b} .fbsn{fill:var(--ink);font:700 11px var(--font)}
.fbbar{fill:rgba(0,122,255,.55)} .fbx{fill:var(--bad);font:700 14px var(--font);text-anchor:middle} .fbop{fill:none;stroke:var(--ink);stroke-width:2}
.fbd circle{fill:var(--blue);stroke:#fff;stroke-width:1.5}
.fbd.root circle{fill:#E5352B} .fbd.tone circle{fill:var(--blue)} .fbd.pick circle{fill:var(--extra)}
.fbd text{fill:#fff;font:700 11px var(--font);text-anchor:middle}
.pnwrap{width:100%;height:150px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;border-radius:12px;box-shadow:inset 0 0 0 1px var(--sep)}
.pnwrap .kbd{height:150px;overflow:visible}
.pnwrap .kin{position:relative;height:100%}
.kbd .mk.root{background:#E5352B} .kbd .mk.tone{background:var(--blue)} .kbd .mk.pick{background:var(--extra)}
.kbd .wh.sel{background:#cfe0ff} .kbd .bk.sel{background:#3a6bd4}
.vnums{display:flex;gap:8px;flex-wrap:wrap}
.notechips,.selnotes{display:flex;flex-wrap:wrap;gap:6px}
.nc{min-width:40px;min-height:36px;padding:0 10px;border-radius:18px;background:var(--card2);display:inline-grid;place-items:center;font:700 15px var(--font);box-shadow:inset 0 0 0 1px var(--sep)}
.nc.root{background:#E5352B;color:#fff;box-shadow:none}
.nc.tone{background:var(--blue-soft);color:var(--blue)}
.selrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chordstrip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
.chc{flex:0 0 auto;min-width:64px;min-height:56px;padding:6px 12px;border-radius:12px;border:0;background:var(--card2);color:var(--ink);display:grid;place-items:center;font:700 17px var(--font);box-shadow:inset 0 0 0 1px var(--sep)}
.chc small{font-weight:500;font-size:12px;color:var(--muted)}
.chc.now,.chc[aria-pressed="true"]{background:var(--blue);color:#fff;box-shadow:none} .chc.now small,.chc[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mini{border:0;background:var(--card2);border-radius:12px;padding:6px;display:grid;gap:4px;justify-items:center;color:var(--ink);font:600 13px var(--font)}
.mini .pnwrap{height:64px;box-shadow:none} .mini .pnwrap .kbd{height:64px}
.metbig{padding:14px;display:grid;gap:14px}
.bpmrow{display:flex;align-items:center;justify-content:center;gap:16px}
.bpmb{width:56px;height:56px;border-radius:50%;border:0;background:var(--card2);color:var(--ink);font:600 30px var(--font);box-shadow:inset 0 0 0 1px var(--sep)}
.bpmv{display:grid;place-items:center;min-width:120px} .bpmv b{font:700 64px/1 var(--font);font-variant-numeric:tabular-nums} .bpmv span{color:var(--muted);font-size:14px}
.metbig input[type=range]{width:100%;height:44px}
.mdots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:28px}
.mdots i{width:24px;height:24px;border-radius:50%;background:var(--card2);box-shadow:inset 0 0 0 1px var(--sep)}
.mdots i.acc{box-shadow:inset 0 0 0 2px var(--bad)} .mdots i.on{background:var(--play)} .mdots i.acc.on{background:var(--bad)}
.metbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input.txt,textarea.code{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:0;background:var(--card2);color:var(--ink);font:16px var(--font);box-shadow:inset 0 0 0 1px var(--sep);box-sizing:border-box}
textarea.code,.mono{font-family:var(--mono)}
.bigplay{min-height:52px;border:0;border-radius:14px;background:var(--play);color:var(--play-ink);font:700 18px var(--font);display:flex;align-items:center;justify-content:center;gap:8px}
.bigplay svg{width:22px;height:22px}
.bigplay.stoprec{background:var(--bad);color:#fff}
.filebtn{position:relative;display:flex;align-items:center;justify-content:center;min-height:48px;cursor:pointer}
.acts4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.recbox{display:grid;gap:10px}
.recst{font-weight:600;text-align:center}
.lvl{height:10px;border-radius:5px;background:var(--card2);overflow:hidden}
.lvl i{display:block;height:100%;width:0;background:var(--play);transition:width .12s}
.msg.bad{padding:10px 12px;border-radius:10px;background:rgba(229,53,43,.12);color:var(--bad);font-weight:600}
.scorewrap,.tabwrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.scorewrap svg,.tabwrap svg{display:block;max-width:100%;height:auto}
.tabsvg .tl{stroke:var(--ink);stroke-width:1} .tabsvg .tb{stroke:var(--ink);stroke-width:1.5}
.tabsvg .tsn{fill:var(--muted);font:700 11px var(--font)} .tabsvg .tbn{fill:var(--muted);font:600 10px var(--font)}
.tabsvg .tn rect{fill:var(--card)}
.tabsvg .tn text{fill:var(--ink);font:700 13px var(--font);text-anchor:middle}
.tabsvg .tn.cur rect{fill:var(--blue)} .tabsvg .tn.cur text{fill:#fff}
.tabvid{width:100%;max-height:260px;border-radius:12px;background:#000}
.score .tie{fill:none;stroke:var(--staff);stroke-width:1.4}
.levcard{padding:12px 14px;display:grid;gap:10px}
.fit{font-weight:700;color:var(--play);font-variant-numeric:tabular-nums}
.barrow{display:flex;gap:6px;flex-wrap:wrap}
.barc{flex:1 1 120px;display:flex;gap:6px;padding:8px;border-radius:10px;background:var(--card2);justify-content:space-around}
.cc{display:grid;place-items:center;font-size:18px} .cc small{font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted)}
.foot{color:var(--muted);font-size:13px}
.playtog.on{background:var(--bad);color:#fff}
html,body{max-width:100%;overflow-x:hidden}
.showcard,.levcard,.metbig{grid-template-columns:minmax(0,1fr);min-width:0}
.showcard>*,.levcard>*{min-width:0}
.showopts .seg{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.showopts .seg button{flex:0 0 auto;white-space:nowrap}

/* ===== v5 ===== */
.sndbox{padding:0;overflow:hidden}
.sndbox summary{min-height:48px;display:flex;align-items:center;padding:0 16px;font-weight:600;cursor:pointer;list-style:none}
.sndbox summary::-webkit-details-marker{display:none}
.sndbox summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.sndbox[open] summary::after{transform:rotate(-135deg)}
.sndin{display:grid;gap:10px;padding:0 16px 16px;min-width:0}
.volrow{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr) 46px;gap:12px;align-items:center;min-height:44px}
.volrow label{font-weight:600;white-space:nowrap}
.volrow input[type=range]{width:100%;min-width:0;height:44px;margin:0}
.volrow output{font:600 14px var(--mono);text-align:right;color:var(--muted)}
.acts4 .btn,.acts4 .pill{display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;text-align:center;line-height:1.15;padding:6px 10px;min-width:0}
.acts4 .btn svg{flex:none;width:18px;height:18px}
.levcard .acts4{grid-template-columns:repeat(2,minmax(0,1fr))}
.levcard .acts4 .btn:last-child{grid-column:1 / -1}
.btn.playtog.on svg,.pill.playtog.on svg{display:none}
.btn.playtog.on::before,.pill.playtog.on::before{content:"";width:12px;height:12px;border-radius:2px;background:currentColor;flex:none}
@media (orientation:landscape) and (max-height:520px){
  #play.tap .rt-head{display:none}
  #play.tap .rt-count{padding-top:2px;padding-bottom:4px}
  #play.tap .staffzone{min-height:0}
  #play.tap .stopbtn{min-height:38px;margin-bottom:6px}
  #play.tap .pmain{display:flex;flex-direction:column;min-height:0}
  #play.tap .staffzone.rt{flex:1 1 0;min-height:0}
}
#play.tap .staffzone{scroll-behavior:auto;overscroll-behavior:contain}
.staffzone.rt::after{content:"";position:sticky;bottom:0;left:0;right:0;display:block;height:18px;margin-top:-18px;background:linear-gradient(transparent,var(--card));pointer-events:none}
#play.hasres{grid-template-columns:minmax(0,1fr)!important}
#play.hasres .pmain{grid-column:1 / -1!important;max-width:760px;width:100%;margin:0 auto}
#views .cap{padding-top:10px}#melres .group+.cap{margin-top:8px}

/* v7 duration bars (dictation) */
.score .dbar{fill:var(--nc,var(--staff));opacity:.85}
.score .dbar.r{fill:none;stroke:var(--muted);stroke-width:1.3;stroke-dasharray:3 2.5;opacity:.9}
.score .dbar.st-perfect{fill:var(--ok);stroke:none;opacity:.9} .score .dbar.r.st-perfect{fill:none;stroke:var(--ok)}
.score .dbar.st-miss{fill:var(--bad)} .score .dbar.r.st-miss{fill:none;stroke:var(--bad)}

/* v7 rhythm tap: exactly 3 rows, no manual scroll while playing */
#play.tap .staffzone.rt3{overflow:hidden;flex:1 1 0;min-height:0;display:block}
#play.tap .staffzone.rt3>svg{margin:0}
.staffzone.rt3::after{display:none}

/* v7 note reading helper + guide */
.hintrow{display:flex;align-items:center;gap:8px;background:var(--card);padding-right:max(10px,env(safe-area-inset-right,0px))}
.hintrow .hintline{flex:1;min-width:0;text-align:left;padding-left:max(14px,env(safe-area-inset-left,0px));font-weight:600;color:var(--ink)}
.hbtn{flex:none;min-height:38px;padding:0 12px;font-size:14px}
.hbtn[aria-pressed="true"]{background:var(--blue);color:#fff}
.hbtn svg{width:18px;height:18px}
.score .hlab circle{fill:var(--card2);stroke:var(--sep);stroke-width:1}
.score .hlab text{fill:var(--ink);font-weight:800;text-anchor:middle;font-family:var(--mono,ui-monospace,monospace)}
.score .hlab.sp circle{fill:var(--card);stroke-dasharray:2 2}
.score .hlab.cur circle{fill:var(--blue);stroke:var(--blue)} .score .hlab.cur text{fill:#fff}
.kbd .wh.hk{background:#bcd3ff} .kbd .bk.hk{background:#3a6bd4}
.kbd .mk.help{background:var(--blue);box-shadow:0 0 0 3px rgba(60,100,255,.35);width:clamp(30px,6.4vw,50px);height:clamp(30px,6.4vw,50px);font-size:clamp(12px,2.3vw,18px)}
.guidebox{padding:12px;display:grid;gap:8px;min-width:0}
.guidebox svg{width:100%;height:auto;max-height:230px}
.guide .nt.gl-line{--nc:var(--ink)} .guide .nt.gl-space{--nc:var(--blue)}
.guide .stem{display:none}
.guide .glt{font:800 15px var(--mono,ui-monospace,monospace);text-anchor:middle}
.guide .glt.gl-line{fill:var(--ink)} .guide .glt.gl-space{fill:var(--blue)}
.gtext p{font-size:14px;color:var(--muted);line-height:1.45} .gtext b{color:var(--ink)} .gtext i{color:var(--ink)}

.bpmrow{gap:8px}
.bpmb[data-d="10"],.bpmb[data-d="-10"]{width:46px;height:46px;font-size:16px;font-weight:700}
.bpmb{width:52px;height:52px;flex:none}
.bpmv{min-width:0;flex:1 1 auto;text-align:center}

/* v7 file inputs sit on top of their buttons so the tap lands on the real input (more reliable on iOS) */
.fin{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px;z-index:2}

/* v7 progress */
.prange{margin:0 0 12px}
.ptiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media (min-width:640px){.ptiles{grid-template-columns:repeat(4,minmax(0,1fr))}}

.ptiles b{font:800 28px var(--font);letter-spacing:-.02em}

.bars.dense{gap:2px}
.goalnote{padding:0 14px 10px;font-size:12px;color:var(--muted)}
.mcard{padding:14px;display:grid;gap:10px;margin-bottom:10px;min-width:0}
.mc1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}

.mavg .up{color:var(--ok)} .mavg .dn{color:var(--bad)}
.mc2{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.spark{width:120px;height:34px;flex:none} .spark.none{font-size:12px;color:var(--muted);width:auto;height:auto}
.mx{display:grid;gap:2px;font-size:13px;color:var(--muted);min-width:0} .mx b{color:var(--ink)}
.wk{border:0;background:var(--card2);color:var(--ink);border-radius:99px;min-height:34px;padding:0 12px;font:600 14px var(--font)}
.sbadge{font:700 14px var(--mono);padding:3px 9px;border-radius:99px;background:var(--card2)}
.sbadge.g{background:rgba(52,199,89,.18);color:var(--ok)} .sbadge.o{background:rgba(255,159,10,.2);color:var(--warn)} .sbadge.r{background:rgba(255,59,48,.16);color:var(--bad)}
.btn.danger{color:var(--bad)}
.hbtn svg{flex:none}
.bpmv b{font-size:clamp(40px,12vw,68px)!important;line-height:1}
.bpmv{overflow:hidden}

/* v8 scale keys */
.kbd .mk.scalek{background:rgba(60,100,255,.78);width:clamp(22px,4.6vw,38px);height:clamp(22px,4.6vw,38px);font-size:clamp(10px,1.8vw,14px)}
.kbd .mk.scalek.root{background:#E5352B}

/* v8 steady rows: moved with transform, not scrollTop */
.staffzone.rt3>svg{will-change:transform;backface-visibility:hidden}
.score .bhl{opacity:.4;stroke:var(--ok);stroke-width:2}
.score .bcg.on .bcirc{stroke:var(--ok);stroke-width:3}
.troub{display:grid;gap:8px}
.troub button{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;text-align:left;background:var(--card2);border:0;border-radius:12px;padding:8px 12px;color:var(--ink);font:600 14px var(--font)}
.troub svg{width:100%;height:auto;max-height:70px}
.troub b{color:var(--blue);font-size:14px}
.tappad:disabled{opacity:.85}

/* v8 tab compare */
.tabcard{overflow:visible!important}
.tabsticky{position:sticky;top:0;z-index:5;background:var(--card);padding:8px 0;display:grid;gap:8px;border-bottom:1px solid var(--sep)}
.tabsticky .tabvid{max-height:34vh;width:100%;border-radius:12px;background:#000}
.cmpbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cmpbar .btn{min-width:96px}
.tabn .tn.sel rect,.tabsvg .tn.sel rect{stroke:var(--blue);stroke-width:3}
.noteed{display:grid;gap:8px;padding:10px 0}
.nedhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px} .nedhead span{color:var(--muted)}
.yourrec{display:grid;gap:6px}
@media (orientation:landscape) and (max-height:520px){.tabsticky .tabvid{max-height:46vh}}

</style>

function accLabel(n){return n===0?'no ♯ or ♭':(n>0?n+'♯':(-n)+'♭');}

function dName(n){return LET[n.d%7]+(n.alt===1?'♯':(n.alt===-1?'♭':''))+Math.floor(n.d/7);}
function dLetter(d){return LET[((d%7)+7)%7]+Math.floor(d/7);}

var UNIT=250,ANCH={g:235,f:644.5,c:501,flat:132,nat:132,sharp:132,head:134};

function movePlayhead(host,lay,tick){
  var ph=host.querySelector('#ph');if(!ph)return;
  var M=lay.M,i=Math.floor(tick/M.cap);if(i<0||i>=lay.count){ph.style.display='none';return;}
  var within=tick-i*M.cap,row=Math.floor(i/lay.n),col=i%lay.n,x0=lay.headW+col*lay.mw,pt=(lay.mw-28)/M.cap,y0=lay.rows[row],x=x0+14+within*pt+7;
  var bh=host.querySelector('#bh');
  if(bh){var bi=Math.min(M.beats-1,Math.floor(within/M.beat)),bw=M.beat*pt;bh.setAttribute('x',f1(x0+14+bi*bw));bh.setAttribute('y',f1(y0-40));bh.setAttribute('width',f1(bw));bh.setAttribute('height','78');bh.style.display='';
    var nb=host.querySelector('.bcg[data-m="'+i+'"][data-b="'+bi+'"]'),pv=host.querySelector('.bcg.on');if(pv&&pv!==nb)pv.classList.remove('on');if(nb)nb.classList.add('on');}

  /* The current row is always line 1 of 3. The view only moves in the last stretch of a row, with a fixed eased glide that
     finishes exactly when the next row starts, so the new row is already in line 1 when its first note arrives. */

    if(p>0){p=Math.min(1,p);p=p*p*(3-2*p);tgt=top(row)+(top(row+1)-top(row))*p;}
  }

}

  ks.forEach(function(k){var d=new Date(k+'T12:00:00');if(prev&&Math.round((d-prev)/864e5)===1)run++;else run=1;prev=d;if(run>best)best=run;});return best;

function latencyCard(){
  var o=S.prefs.offset;
  return '<div><div class="cap">Tap timing</div><div class="group latcard"><div class="latt"><b>Latency offset</b> <output id="latv">'+(o>0?'+':'')+o+' ms</output></div><p>Screens and speakers delay what you hear and feel. Calibrate once per device, and again if you switch to Bluetooth headphones.</p><div class="latb"><button type="button" aria-label="Lower offset" data-act="latstep" data-d="-1">−</button><button type="button" aria-label="Raise offset" data-act="latstep" data-d="1">+</button><button type="button" class="wide" data-act="calib">Calibrate</button><button type="button" class="wide off" data-act="latreset">Reset</button></div></div><p class="foot">Raise if your taps score early, lower if late.</p></div>';
}
ACT.latstep=function(el){S.prefs.offset=clamp(S.prefs.offset+(+el.dataset.d)*5,-300,300);persist();var v=$('latv');if(v)v.textContent=(S.prefs.offset>0?'+':'')+S.prefs.offset+' ms';var w=$('latv2');if(w)w.textContent=(S.prefs.offset>0?'+':'')+S.prefs.offset+' ms';};
ACT.latreset=function(){S.prefs.offset=0;persist();render();toast('Offset reset');};
var CAL=null;
ACT.calib=function(){
  if(!A.unlock()){toast('Audio is not available');return;}
  CAL={taps:[],clicks:[],done:false,t0:0};
  openSheet('Calibrate','<p class="hint">Tap the pad exactly on each click. Four count-in clicks, then eight to tap along with.</p><div class="calstat" id="calstat">Get ready…</div><button type="button" class="tappad calpad" id="calpad" aria-label="Tap on each click">TAP</button><div id="calres"></div>',function(){if(CAL){CAL.done=true;A.stop();CAL=null;}});
  var bpm=100,sec=60/bpm,t0=A.now()+0.8;CAL.t0=t0;
  for(var i=0;i<12;i++){A.click(t0+i*sec,i%4===0);if(i>=4)CAL.clicks.push(t0+i*sec);}
  var pad=$('calpad');
  pad.addEventListener('pointerdown',function(e){e.preventDefault();if(!CAL||CAL.done)return;var n=A.now();CAL.taps.push(n);if(S.prefs.sound)A.perc(n,S.prefs.inst);pad.classList.add('hit');setTimeout(function(){pad.classList.remove('hit');},80);});
  var iv=setInterval(function(){
    if(!CAL||CAL.done){clearInterval(iv);return;}
    var n=A.now(),st=$('calstat');if(!st)return;
    if(n<t0)st.textContent='Get ready…';else if(n<t0+4*sec)st.textContent='Count-in '+(Math.floor((n-t0)/sec)+1);else if(n<t0+12*sec+0.3)st.textContent='Tap with the clicks '+Math.min(8,Math.floor((n-t0)/sec)-3)+'/8';
    else{clearInterval(iv);calFinish();}
  },80);
};
function calFinish(){
  var C=CAL;if(!C)return;C.done=true;
  var errs=[];C.clicks.forEach(function(ck){var best=null;C.taps.forEach(function(t){var d=t-ck;if(Math.abs(d)<0.35&&(best===null||Math.abs(d)<Math.abs(best)))best=d;});if(best!==null)errs.push(best*1000);});
  var st=$('calstat'),res=$('calres');if(st)st.textContent='Done';
  if(errs.length<4){res.innerHTML='<div class="msg bad">Only '+errs.length+' of 8 taps were heard. Try again.</div><button type="button" class="btn fill" style="width:100%;margin-top:10px" data-act="calib">Try again</button>';return;}
  errs.sort(function(a,b){return a-b;});var med=errs[Math.floor(errs.length/2)],off=Math.round(-med/5)*5;C.off=off;
  res.innerHTML='<div class="msg">Your taps landed about <b>'+Math.abs(Math.round(med))+' ms '+(med>0?'late':'early')+'</b> ('+errs.length+' of 8 heard). Suggested offset: <b>'+(off>0?'+':'')+off+' ms</b>.</div><div class="acts4" style="margin-top:10px"><button type="button" class="btn fill" data-act="calapply">Apply</button><button type="button" class="btn" data-act="calib">Again</button></div>';
}
ACT.calapply=function(){if(CAL&&CAL.off!==undefined){S.prefs.offset=clamp(CAL.off,-300,300);persist();}closeSheet();render();toast('Offset set to '+(S.prefs.offset>0?'+':'')+S.prefs.offset+' ms');};

function pickOptions(m,k){

/* ---------- editors ---------- */
ACT.editor=function(){R.fresh=true;R.edit=true;R.ed={cur:0,rest:false,item:null,root:60};render();};
ACT.edback=function(){R.fresh=true;R.edit=false;render();};
function edNav(title){return '<div class="nav"><button type="button" class="back" data-act="edback">'+IC.back+MODES[R.setup].name+'</button><h2 class="title grow">'+title+'</h2><button type="button" class="link" data-act="edback" style="font-weight:600">Done</button></div>';}
function editorPage(m){
  if(m==='pitch')return pitchEditorPage();
  if(m==='ear')return earEditorPage();

}
function editorPost(m){

/* --- rhythm editor (rhythm tap + dictation) --- */
var PAL=[['w',0,0,'Whole'],['h',1,0,'Half ·'],['h',0,0,'Half'],['q',1,0,'Quarter ·'],['q',0,0,'Quarter'],['e',1,0,'8th ·'],['e',0,0,'8th'],['s',0,0,'16th'],['q',0,1,'Qtr triplet'],['e',0,1,'8th triplet'],['s',0,1,'16th triplet']];
function rhythmEditorPage(m){
  var cu=S[m].custom,M=METERS[cu.meter],ed=R.ed;
  if(!cu.measures.length)cu.measures=[[]];
  if(ed.cur>=cu.measures.length)ed.cur=0;
  var rem=M.cap-sumT(cu.measures[ed.cur]);
  var h=edNav('Custom rhythm');
  h+=grp('',rPick('Time signature',m,'cmeter',cu.meter,'Changing it clears the bars')+
    '<div class="row"><span class="lab">Bars</span><span class="step"><button type="button" aria-label="Fewer bars" data-act="edbars" data-d="-1">−</button><output>'+cu.measures.length+'</output><button type="button" aria-label="More bars" data-act="edbars" data-d="1">+</button></span></div>');
  h+='<div class="group"><div id="edzone" class="edstaff"></div></div><p class="hint" id="edstat"></p>';
  var tab=ed.tab||'n';
  h+='<div><div class="cap" style="display:flex;justify-content:space-between;align-items:center"><span>Add to bar '+(ed.cur+1)+'</span><span class="seg"><button type="button" data-act="edtab" data-v="n" aria-pressed="'+(tab==='n')+'">Notes</button><button type="button" data-act="edtab" data-v="r" aria-pressed="'+(tab==='r')+'">Rests</button><button type="button" data-act="edtab" data-v="p" aria-pressed="'+(tab==='p')+'">Pattern</button></span></div>';
  if(tab==='p')h+=patternGrid(m,rem);
  else h+='<div class="palgrid">'+PAL.map(function(p,i){var t=tickOf(p[0],p[1],p[2]);return '<button type="button" class="dur" data-act="edadd" data-i="'+i+'"'+(t<=0||t>rem?' disabled':'')+' aria-label="'+p[3]+(tab==='r'?' rest':'')+'">'+durGlyph(p[0],p[1],tab==='r',p[2])+'<span>'+p[3]+'</span></button>';}).join('')+'</div>';
  h+='</div>';
  h+='<div class="acts4"><button type="button" class="btn" data-act="edundo">'+IC.undo+'Undo</button><button type="button" class="btn" data-act="edclear">Clear bar</button><button type="button" class="btn" data-act="edrandom">Random bar</button></div>';
  return h;
}
function drawRhythmEd(m){
  var cu=S[m].custom,M=METERS[cu.meter],z=$('edzone');if(!z)return;
  var ed=R.ed,w=z.clientWidth;
  rhythmStage(z,cu.measures,M,{cur:ed.cur,used:sumT(cu.measures[ed.cur]),hits:true,nums:true,scale:clamp(w/340,1,1.45),res:cu.measures.map(function(x){return sumT(x)===M.cap?'ok':null;})});
  var rem=M.cap-sumT(cu.measures[ed.cur]),done=cu.measures.every(function(x){return sumT(x)===M.cap;});
  var st=$('edstat');if(st)st.textContent='Bar '+(ed.cur+1)+' of '+cu.measures.length+' · '+(rem===0?'full':(Math.round(rem/M.beat*100)/100)+' beats left')+(done?' · every bar is complete, ready to play':'');
}
document.addEventListener('click',function(e){
  var h=e.target.closest?e.target.closest('#edzone .hit[data-m]'):null;if(!h||!R.edit)return;
  R.ed.cur=+h.dataset.m;render();
});
function edAdvance(m){
  var cu=S[m].custom,M=METERS[cu.meter],ed=R.ed;
  if(sumT(cu.measures[ed.cur])===M.cap){for(var k=1;k<cu.measures.length;k++){var j=(ed.cur+k)%cu.measures.length;if(sumT(cu.measures[j])<M.cap){ed.cur=j;break;}}}
}
ACT.edtab=function(el){R.ed.tab=el.dataset.v;R.ed.rest=el.dataset.v==='r';render();};
ACT.edbars=function(el){
  var m=R.setup,cu=S[m].custom,d=+el.dataset.d;
  if(d>0&&cu.measures.length<16)cu.measures.push([]);
  else if(d<0&&cu.measures.length>1){cu.measures.pop();if(R.ed.cur>=cu.measures.length)R.ed.cur=cu.measures.length-1;}
  persist();render();
};
ACT.edadd=function(el){
  var m=R.setup,cu=S[m].custom,M=METERS[cu.meter],p=PAL[+el.dataset.i],t=tickOf(p[0],p[1],p[2]),bar=cu.measures[R.ed.cur];
  if(t<=0||sumT(bar)+t>M.cap)return;
  bar.push({t:t,r:R.ed.rest?1:0});
  if(S.prefs.sound&&!R.ed.rest&&A.unlock())A.perc(A.now(),S.prefs.inst);
  edAdvance(m);persist();render();
};
ACT.edundo=function(){
  var m=R.setup,cu=S[m].custom,i=R.ed.cur;
  if(!cu.measures[i].length){for(var k=cu.measures.length-1;k>=0;k--)if(cu.measures[k].length){i=k;break;}}
  if(cu.measures[i].length){R.ed.cur=i;cu.measures[i].pop();persist();render();}
};
ACT.edclear=function(){var m=R.setup;S[m].custom.measures[R.ed.cur]=[];persist();render();};
ACT.edrandom=function(){
  var m=R.setup,cu=S[m].custom,M=METERS[cu.meter];
  if(!(M.beat===12||(M.compound&&M.beat===18))){toast('Random bars need a quarter-note or dotted-quarter beat');return;}
  cu.measures[R.ed.cur]=genMeasure(S[m].level||3,M);edAdvance(m);persist();render();
};
function patternGrid(m,rem){
  var body='';
  PATS.forEach(function(g,gi){
    body+='<div style="margin-bottom:10px"><div class="cap" style="padding-left:2px">'+g[0]+'</div><div class="patgrid">';
    for(var i=1;i<g.length;i++){
      var toks=T(g[i]),tot=sumT(toks),fake={cap:tot,beat:g[0].indexOf('Compound')===0?18:12,beats:1};
      var svg='<svg class="score" viewBox="0 0 120 58" width="100%" aria-hidden="true"><line class="ln" x1="0" y1="40" x2="120" y2="40" stroke-width="1.2"/>'+drawMeasure(fake,toks,-6,132,40,'',false)+'</svg>';
      body+='<button type="button" class="patbtn" data-act="edpat" data-g="'+gi+'" data-i="'+i+'"'+(tot>rem?' disabled':'')+' aria-label="'+g[i].join(' ')+'">'+svg+'</button>';
    }
    body+='</div></div>';
  });
  return '<p class="foot" style="padding:0 0 8px">Tap a pattern to add it. Patterns that do not fit the space left are dimmed.</p>'+body;
}
ACT.edpat=function(el){
  var m=R.setup,cu=S[m].custom,M=METERS[cu.meter],toks=T(PATS[+el.dataset.g][+el.dataset.i]),bar=cu.measures[R.ed.cur];
  if(sumT(bar)+sumT(toks)>M.cap)return;
  toks.forEach(function(t){bar.push(t);});
  edAdvance(m);persist();render();
};

/* --- pitch editor --- */
function spell(m){
  var s=m%12,oct=Math.floor(m/12)-1,i=SEMI.indexOf(s);
  if(i>=0)return {d:7*oct+i,alt:0};
  var flat=keyById(S.pitch.key).n<0;
  if(flat){var j=SEMI.indexOf(s+1);return {d:7*oct+j,alt:-1};}
  var k=SEMI.indexOf(s-1);return {d:7*oct+k,alt:1};
}
function pitchEdRange(){
  var c=S.pitch,ds=c.custom.map(function(n){return n.d;}).concat([c.lo,c.hi]);
  return {lo:Math.min.apply(null,ds)-1,hi:Math.max.apply(null,ds)+1};
}
function pitchEditorPage(){
  var c=S.pitch,r=pitchEdRange(),L=pitchKbdLayout(Math.max(8,r.lo),r.hi);
  var h='<div class="scroll"><div class="page">'+edNav('Custom notes');
  h+='<div class="group"><div id="edzone" class="edstaff2"></div></div><p class="hint" id="edcnt"></p>';
  h+='<div class="acts4"><button type="button" class="btn" data-act="pedundo">'+IC.undo+'Undo</button><button type="button" class="btn" data-act="pedclear">Clear</button><button type="button" class="btn" data-act="pedrand">Add 8 random</button></div>';
  h+='<p class="hint">'+CLEFS[c.clef].name+' clef · '+keyLabel(c)+'. Change these on the previous screen. Black keys are spelled '+(keyById(c.key).n<0?'with flats':'with sharps')+' for this key.</p>';
  h+='</div></div><div class="edbar"><div class="kbd" id="edkbd">'+kbdHtml(L,{minKey:40,names:c.names})+'</div></div>';
  return h;
}
function drawPitchEd(){
  var z=$('edzone'),c=S.pitch;if(!z)return;
  var r=pitchEdRange(),ex={clef:c.clef,key:c.key,lo:Math.max(8,r.lo),hi:r.hi,notes:c.custom};
  var lay=pitchStrip(z,ex,26);
  if(c.custom.length){var l=lay.note(c.custom.length-1);if(l)l.setAttribute('class','nt cur');lay.go(c.custom.length-1);}
  var cnt=$('edcnt');if(cnt)cnt.textContent=c.custom.length?c.custom.length+' notes. Tap piano keys to add more.':'Tap piano keys to add notes.';
}
document.addEventListener('click',function(e){
  var k=e.target.closest?e.target.closest('#edkbd [data-m]'):null;if(!k||!R.edit)return;
  var m=+k.dataset.m;A.unlock();
  if(S.prefs.sound)A.tone(m,A.now()+0.005,0.6,0.45);
  kbdFlash($('edkbd'),m,'down',240);
  if(R.setup==='pitch'){
    if(S.pitch.custom.length>=60){toast('60 notes is the maximum');return;}
    S.pitch.custom.push(spell(m));persist();drawPitchEd();
  }else if(R.setup==='ear'){R.ed.root=m;earEdMarks();}
});
ACT.pedundo=function(){S.pitch.custom.pop();persist();drawPitchEd();};
ACT.pedclear=function(){S.pitch.custom=[];persist();drawPitchEd();};
ACT.pedrand=function(){
  var c=S.pitch,g=genPitch({clef:c.clef,key:c.key,minor:c.minor,harm:c.harm,lo:c.lo,hi:c.hi,count:Math.min(8,60-c.custom.length),leap:c.leap,acc:c.acc,rep:c.rep});
  g.notes.forEach(function(n){c.custom.push(n);});persist();drawPitchEd();
};

/* --- ear editor --- */

  h+='<div><div class="cap">Item</div><div class="chips">'+E.items.map(function(it){return '<button type="button" class="chipb" data-act="edearitem" data-v="'+esc(it[0])+'" aria-pressed="'+(ed.item===it[0])+'">'+esc(it[0])+'</button>';}).join('')+'</div><p class="foot" id="edearname"></p></div>';

  if(c.type==='interval')opt=rSeg('Direction','ear','dir',[['asc','Up'],['desc','Down'],['harm','Both'],['mix','Mix']],c.dir);
  if(c.type==='chord')opt=rSeg('Play as','ear','arp',[['0','Block'],['1','Arpeggio']],c.arp?'1':'0');
  if(c.type==='scale')opt=rSeg('Direction','ear','dir',[['asc','Up'],['desc','Down']],c.dir==='desc'?'desc':'asc');

  h+='<div><div class="cap">Questions ('+list.length+')</div>'+(list.length?'<div class="group">'+list.map(function(x){
    var q=x.q,dir=q.type==='interval'?({asc:' ↑',desc:' ↓',harm:' ↕',mix:' ⇅'})[q.dir||'asc']:'';
    return '<div class="libitem"><h3>'+esc(q.id)+' <span style="color:var(--muted);font-weight:400">· '+midiName(q.root)+dir+'</span></h3><span class="meta">'+esc((earItem(q.type,q.id)||['','' ])[1])+'</span><span class="acts"><button type="button" class="btn" data-act="edearplay" data-i="'+x.i+'" aria-label="Play">'+IC.spk+'</button><button type="button" class="btn danger" data-act="edeardel" data-i="'+x.i+'" aria-label="Delete">'+IC.x+'</button></span></div>';}).join('')+'</div>':'<div class="group"><div class="empty" style="padding:18px">No questions yet. Pick an item and a root note, then Add question.</div></div>')+'</div>';
  h+='</div></div><div class="edbar"><div class="kbd" id="edkbd">'+kbdHtml(kbdLayout(36,83),{minKey:34})+'</div></div>';
  return h;
}
function earEdMarks(){

ACT.edearitem=function(el){R.ed.item=el.dataset.v;render();};
ACT.edearadd=function(){
  var c=S.ear,ed=R.ed;if(c.custom.length>=80){toast('80 questions is the maximum');return;}

ACT.edeardel=function(el){S.ear.custom.splice(+el.dataset.i,1);persist();render();};
ACT.edearplay=function(el){

  var it=earItem(q.type,q.id),b=earBuild(q.type,it,q.root,q.dir==='mix'?'asc':q.dir,S.ear.arp,0);A.stop();A.seq(b.ev);

    if(!notes.length){t.state='idle';t.err=noNotesMsg()+' You can also move "Start at" to a part with one note at a time.';render();return;}

  });

function tabBuild(){
  var t=TS.tab,T=S.tools,inst=T.tabinst,tun=tuning(inst),grid=+(T.tabgrid||6),bpm=T.tabbpm||100,tps=bpm/60*12,mf=inst==='bass'?20:(inst==='violin'?14:21);
  var notes=t.raw,asg=assignFrets(notes,tun,mf),ev=[],last=-1;
  var base=notes[0].t0;
  notes.forEach(function(n,i){
    var col=Math.max(0,Math.round((n.t0-base)*tps/grid));if(col<=last)col=last+1;last=col;
    ev.push({col:col,s:asg[i].s,f:asg[i].f,m:asg[i].m,t0:n.t0,t1:n.t1,shifted:asg[i].shifted});
  });
  t.ev=ev;t.base=base;t.grid=grid;t.shifted=ev.filter(function(e){return e.shifted;}).length;
  var cpb=Math.round(48/grid);t.cpb=cpb;t.total=Math.ceil((last+1)/cpb)*cpb;
}
function tabPost(){
  var t=TS.tab,T=S.tools;if(!(t.ev&&t.state==='done'))return;
  var box=$('tabbox');if(!box)return;
  var tun=tuning(T.tabinst),W=Math.max(260,box.clientWidth),r=tabSvg(t.ev,tun,W,t.cpb,t.total,{bars:true});
  box.innerHTML=r.svg;t.rowH=r.rowH;t.perRow=r.perRow;
  t.txt=tabText(t.ev,tun.length,tun,t.cpb,t.total);
  var i=$('tabinfo');if(i)i.textContent=t.ev.length+' notes · '+(T.tabbpm||100)+' BPM'+(t.shifted?' · '+t.shifted+' note'+(t.shifted>1?'s':'')+' moved by an octave to fit the instrument':'')+' · fret numbers; 0 = open string';
  if(t.sel!=null){var se=document.getElementById('tf'+t.sel);if(se)se.classList.add('sel');}
  var v=$('tabvideo');
  if(v&&!v._cmp){
    v._cmp=true;
    v.addEventListener('play',function(){v.muted=((TS.tab.cmp||'both')==='tab');tabSched(v.currentTime);tabBtn();});
    v.addEventListener('pause',function(){A.stop();tabBtn();});
    v.addEventListener('ended',function(){A.stop();tabBtn();});
    v.addEventListener('seeking',function(){if(!v.paused)A.stop();});
    v.addEventListener('seeked',function(){if(!v.paused)tabSched(v.currentTime);});
  }
  if(v&&!v._sync){
    v._sync=true;
    var tick=function(){
      var ct=(v.currentTime||0)-(t.off||0)+0,cur=-1,k;
      if(S.tools.tabstart!==undefined){ct=v.currentTime-(t.off||0);}
      for(k=0;k<t.ev.length;k++){if(t.ev[k].t0<=ct+0.02)cur=k;else break;}
      if(t.curI!==cur){
        var old=document.getElementById('tf'+t.curI);if(old)old.classList.remove('cur');
        var el=document.getElementById('tf'+cur);if(el){el.classList.add('cur');var rw=Math.floor(t.ev[cur].col/t.perRow),b=$('tabbox');if(b&&!v.paused){var wr=b.closest('.showcard');}}
        t.curI=cur;
      }
      if(!v.paused&&document.body.contains(v))requestAnimationFrame(tick);
    };
    v.addEventListener('play',function(){requestAnimationFrame(tick);});
    v.addEventListener('seeked',function(){requestAnimationFrame(tick);});
  }
}

/* =============== NOTE READING =============== */
function genPitch(c){
  var k=keyById(c.key),ka=keyAlts(k.n),lo=c.lo,hi=c.hi,notes=[],d=lo+rnd(hi-lo+1),lead=(((k.t+5)%7)+6)%7;
  for(var i=0;i<c.count;i++){
    var dl=rnd(2*c.leap+1)-c.leap,nd=clamp(d+dl,lo,hi);
    if(!c.rep&&i>0&&nd===d){nd=d+(d>=hi?-1:(d<=lo?1:(Math.random()<.5?-1:1)));}
    if(i===0&&dl===0)nd=lo+rnd(hi-lo+1);
    d=nd;var alt=ka[d%7];
    if(c.minor&&c.harm&&d%7===lead&&ka[lead]<1&&Math.random()<0.6)alt=ka[lead]+1;
    else if(c.acc&&Math.random()<0.2)alt=alt===0?(Math.random()<.5?1:-1):0;
    notes.push({d:d,alt:alt});
  }
  return {clef:c.clef,key:c.key,lo:lo,hi:hi,notes:notes};
}
function pitchKbdLayout(lo,hi){
  var loM=12*(Math.floor(lo/7)+1)+SEMI[lo%7]-1,hiM=12*(Math.floor(hi/7)+1)+SEMI[hi%7]+1;
  return kbdLayout(loM-(((loM%12)+12)%12),hiM+(11-hiM%12));
}
Play.pitch={start:function(){
  var c=S.pitch,cl=CLEFS[c.clef],ex;
  if(c.mode==='custom'){
    if(c.custom.length<2){toast('Add at least 2 notes in the custom editor');return;}
    var ds=c.custom.map(function(n){return n.d;});
    ex={clef:c.clef,key:c.key,lo:Math.min.apply(null,ds),hi:Math.max.apply(null,ds),notes:c.custom.map(function(n){return {d:n.d,alt:n.alt};})};
  }else ex=genPitch(c);
  P={mode:'pitch',ex:ex,i:0,mistakes:0,miss:[],done:false,title:cl.name+' · '+keyLabel(c)+(c.mode==='custom'?' · custom':'')};
  P.L=pitchKbdLayout(ex.lo,ex.hi);
  openPlay('pitch',{main:'<div class="staffzone center" id="zone"></div><div class="hintrow"><div class="hintline" id="hint">Tap the key that matches the blue note</div><button type="button" class="pill hbtn" id="hbtn" data-act="phelp" aria-pressed="false"></button></div>',
    foot:'<div class="keyzone"><div class="kbd" id="kbd">'+kbdHtml(P.L,{minKey:40,names:c.names})+'</div></div>'},P.title+' · 1/'+ex.notes.length);
  startTimer();
  P.redraw=function(){
    P.lay=pitchStrip($('zone'),ex,null,{help:c.help});
    for(var j=0;j<P.i;j++){var n=P.lay.note(j);if(n)n.setAttribute('class','nt ok');}
    var cur=P.lay.note(P.i);if(cur&&!P.done)cur.setAttribute('class','nt cur');
    P.lay.go(Math.min(P.i,ex.notes.length-1));
    if(!P.done)scrollKey();
    helpUpdate();
  };
  P.redraw();
}};
function helpUpdate(){
  if(!P||P.mode!=='pitch')return;
  var c=S.pitch,hb=$('hbtn');if(hb){hb.setAttribute('aria-pressed',String(!!c.help));hb.innerHTML=IC.eye+'<span>Help '+(c.help?'on':'off')+'</span>';}
  var kb=$('kbd'),k=keyById(P.ex.key),ka=keyAlts(k.n);
  if(kb){
    var list=[];
    if(c.help&&!P.done){
      var pcs={},ton=(keyTonicPc(k)+(c.minor?9:0))%12;
      for(var l=0;l<7;l++)pcs[(SEMI[l]+ka[l]+12)%12]=LET[l]+(ka[l]===1?'♯':(ka[l]===-1?'♭':''));
      for(var mm=P.L.lo;mm<=P.L.hi;mm++){var nm=pcs[mm%12];if(nm)list.push({m:mm,cls:'scalek'+(mm%12===ton?' root':''),label:nm});}
    }
    kbdMarkers(kb,P.L,list);
    var old=kb.querySelector('.hk');if(old)old.classList.remove('hk');
  }
  var h=$('hint');if(h&&!P.done)h.textContent=c.help?'Help: the keys of this scale are marked. Find the note on the staff.':'Tap the key that matches the blue note';
}
ACT.phelp=function(){if(!P||P.mode!=='pitch')return;S.pitch.help=!S.pitch.help;persist();P.redraw();};
function scrollKey(){
  if(!P||!P.L)return;
  var kb=$('kbd');if(!kb||kb.scrollWidth<=kb.clientWidth+2)return;
  var m=dMidi(P.ex.notes[Math.min(P.i,P.ex.notes.length-1)]);if(isBlack(m))m-=1;
  var x=(P.L.idx[m]!==undefined?P.L.idx[m]:0)/P.L.nW*kb.scrollWidth,kw=kb.scrollWidth/P.L.nW;
  if(x<kb.scrollLeft+kw||x+kw*2>kb.scrollLeft+kb.clientWidth)kb.scrollTo?kb.scrollTo({left:Math.max(0,x-kb.clientWidth/2),behavior:'smooth'}):(kb.scrollLeft=Math.max(0,x-kb.clientWidth/2));
}
document.addEventListener('click',function(e){
  var k=e.target.closest?e.target.closest('#kbd [data-m]'):null;if(!k||!P||P.done)return;
  var m=+k.dataset.m,kb=$('kbd');A.unlock();
  if(P.mode==='ear'){if(S.prefs.sound)A.tone(m,A.now()+0.005,0.8,0.45);kbdFlash(kb,m,'down',260);return;}
  if(P.mode!=='pitch')return;
  var ex=P.ex,n=ex.notes[P.i],want=dMidi(n);
  if(S.prefs.sound)A.tone(m,A.now()+0.005,0.45,0.45);
  if(m===want){
    kbdFlash(kb,m,'good',300);
    var el=P.lay.note(P.i);if(el)el.setAttribute('class','nt ok');
    P.i++;setProg(P.i/ex.notes.length);
    if(P.i>=ex.notes.length){
      P.lay.go(ex.notes.length-1);$('hint').textContent='Finished';helpUpdate();
      var N=ex.notes.length,pct=Math.round(N/(N+P.mistakes)*100);
      var cnt={};P.miss.forEach(function(x){cnt[x]=1;});
      showResult({pct:pct,title:P.title,n:N,rate:+(N/Math.max(1,(Date.now()-P.t0)/1000)).toFixed(2),miss:Object.keys(cnt),sub:N+' notes · '+P.mistakes+' wrong '+(P.mistakes===1?'tap':'taps'),
        stats:function(s){return [['Time',fmtTime(s)],['Notes / sec',(N/Math.max(1,s)).toFixed(2)],['Mistakes',P.mistakes]];}});
    }else{
      var nx=P.lay.note(P.i);if(nx)nx.setAttribute('class','nt cur');
      P.lay.go(P.i);setMid(P.title+' · '+(P.i+1)+'/'+ex.notes.length);scrollKey();
      $('hint').textContent='Tap the key that matches the blue note';helpUpdate();
    }
  }else{
    kbdFlash(kb,m,'bad',380);P.mistakes++;P.miss.push(dName(n));
    var fl=document.createElement('div');fl.className='flash on';$('zone').appendChild(fl);setTimeout(function(){fl.remove();},400);
    $('hint').textContent='That was '+midiName(m)+'. Look again.';
  }
});

/* =============== RHYTHM TAP =============== */
Play.rhythm={start:function(opt){
  opt=opt||{};
  var c=S.rhythm,ex=opt.ex||genRhythm(c);
  if(!opt.ex&&c.mode==='custom'&&!(c.custom.measures.length&&c.custom.measures.every(function(m){return sumT(m)===METERS[c.custom.meter].cap;}))){toast('Fill every bar in the custom rhythm first');return;}
  var M=METERS[ex.meter];
  P={mode:'rhythm',ex:ex,M:M,c:c,taps:[],done:false,started:false,hearing:!!(c.hear&&!opt.heard&&!opt.title),title:opt.title||((c.mode==='custom'?'Custom · ':'')+ex.meter+(c.mode==='custom'?'':' · '+LEVELN[c.level]))};
  var dots='';for(var i=0;i<M.beats;i++)dots+='<i></i>';
  openPlay('tap',{main:'<div class="rt-head" id="rthead"><h2>'+esc(P.title)+'</h2><span class="chip">'+ex.meter+'</span></div><div class="staffzone rt" id="zone"></div><div class="rt-count" id="rtcount"><b id="cnt">Get ready…</b><span class="cdots" id="dots" aria-hidden="true">'+dots+'</span><span class="chip" id="bpmchip">'+c.bpm+' bpm</span></div><button type="button" class="stopbtn" id="rtstop" data-act="pquit"><i></i>Stop</button>',
    foot:'<button type="button" class="tappad" id="pad" aria-label="Tap here in rhythm"'+(P.hearing?' disabled':'')+'>'+(P.hearing?'LISTEN':'TAP')+'</button>'},(P.hearing?'Listen first · ':P.title+' · ')+c.bpm+' bpm');
  P.redraw=function(){
    var z=$('zone');z.classList.toggle('rt3',!P.done);
    P.lay=rhythmStage(z,ex.measures,M,{ph:!P.done,nums:P.done?false:'circ',old:!P.done,tempo:c.bpm,res:P.resCls,tokCls:P.tokCls,lab:P.lab,extras:P.extraList,scale:P.done?rScale(z):rScale3(z)});
    if(P.beatSec){P.lay.beatSec=P.beatSec;P.lay.tickSec=P.tickSec;}
    if(P.done)z.scrollTop=0;
  };
  P.redraw();
  if(!A.unlock()){$('cnt').textContent='Audio is not available in this browser';return;}
  var beatSec=60/c.bpm,tickSec=beatSec/M.beat,t0=A.now()+0.7;
  P.beatSec=beatSec;P.tickSec=tickSec;P.lay.beatSec=beatSec;P.lay.tickSec=tickSec;P.t0a=t0;P.tEx=t0+M.cap*tickSec;P.total=ex.measures.length*M.cap;
  for(var b=0;b<M.beats;b++)A.click(t0+b*M.beat*tickSec,b===0);
  if(P.hearing){ex.measures.forEach(function(mm,mi){var pos=0;mm.forEach(function(t){if(!t.r)A.perc(P.tEx+(mi*M.cap+pos)*tickSec,S.prefs.inst);pos+=t.t;});});}
  if(c.click||P.hearing)for(var mi=0;mi<ex.measures.length;mi++)for(var bb=0;bb<M.beats;bb++)A.click(P.tEx+(mi*M.cap+bb*M.beat)*tickSec,bb===0);
  startTimer();P.started=true;
  var pad=$('pad');
  pad.addEventListener('pointerdown',function(e){e.preventDefault();doTap(e);});
  pad.addEventListener('keydown',function(e){if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();doTap(e);}});
  function frame(){
    if(!P||P.dead||P.mode!=='rhythm'||P.done)return;
    var now=A.now(),ticks=(now-P.t0a)/tickSec-M.cap;
    if(now<P.t0a){$('cnt').textContent=P.hearing?'Listen first…':'Get ready…';}
    else if(ticks<0){$('cnt').textContent='Count-in';}
    else{$('cnt').textContent=P.hearing?'Listen and watch':'Tap the notes';}
    var pos=((ticks%M.cap)+M.cap)%M.cap,bi=now<P.t0a?-1:Math.floor(pos/M.beat),ds=$('dots').children;
    for(var k=0;k<ds.length;k++)ds[k].classList.toggle('on',k===bi);
    $('dots').classList.toggle('ci',ticks<0);
    if(now>=P.t0a&&ticks<P.total){movePlayhead($('zone'),P.lay,Math.max(0,ticks));if(ticks>=0)setProg(ticks/P.total);}
    if(ticks>P.total+M.beat*0.9){if(P.hearing){var ex2=P.ex;killPlay();Play.rhythm.start({ex:ex2,heard:true});return;}finishTap();return;}
    P.raf=requestAnimationFrame(frame);
  }
  P.raf=requestAnimationFrame(frame);
}};
function doTap(e){
  if(!P||P.mode!=='rhythm'||P.done||!P.started||P.hearing)return;
  var now=A.now(),pad=$('pad');
  if(S.prefs.sound)A.perc(now,S.prefs.inst);
  var ticks=(now-P.t0a)/P.tickSec-P.M.cap;
  if(ticks>-P.M.beat*0.6)P.taps.push(now+S.prefs.offset/1000);
  var r=document.createElement('span');r.className='rip';var bb=pad.getBoundingClientRect(),sz=Math.max(bb.width,bb.height)*0.9;
  r.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+((e.clientX||bb.left+bb.width/2)-bb.left-sz/2)+'px;top:'+((e.clientY||bb.top+bb.height/2)-bb.top-sz/2)+'px';
  pad.appendChild(r);setTimeout(function(){r.remove();},520);
}
function miniBar(M,m){
  var W=260,y0=34;
  return '<svg class="score" viewBox="0 0 '+W+' 66" role="img" aria-label="Rhythm bar"><line class="ln" x1="2" y1="'+y0+'" x2="'+(W-2)+'" y2="'+y0+'" stroke-width="1.4"/>'+drawMeasure(M,m,4,W-8,y0,'',false)+'<line class="ln" x1="'+(W-4)+'" y1="'+(y0-12)+'" x2="'+(W-4)+'" y2="'+(y0+12)+'" stroke-width="2"/></svg>';
}
ACT.rhprac=function(el){
  if(!P||P.mode!=='rhythm'||!P.done)return;
  var all=el.dataset.i==='all',idx=all?P.badBars.slice():[+el.dataset.i],ms=idx.map(function(i){return P.ex.measures[i].map(function(t){return {t:t.t,r:t.r};});}),out=[],k=0;
  while(out.length<4||(all&&out.length<ms.length)){out.push(ms[k%ms.length].map(function(t){return {t:t.t,r:t.r};}));k++;}
  var ex2={meter:P.ex.meter,measures:out},title='Practice · '+(all?'your mistakes':'bar '+(idx[0]+1));
  killPlay();Play.rhythm.start({ex:ex2,title:title});
};
function beatLabel(M,tick){var b=1+tick/M.beat;return 'beat '+(Math.round(b*10)/10).toString().replace(/\.0$/,'');}
function finishTap(){
  var M=P.M,ex=P.ex,exp=[],tok=ex.measures.map(function(m){return m.map(function(){return '';});}),lab=ex.measures.map(function(m){return m.map(function(){return null;});});
  ex.measures.forEach(function(m,mi){var pos=0;m.forEach(function(t,ti){if(!t.r)exp.push({mi:mi,ti:ti,t:t.t,pos:pos,sec:P.tEx+(mi*M.cap+pos)*P.tickSec});pos+=t.t;});});
  var used={},win=Math.min(0.3,P.beatSec*0.5),sum=0,dts=[],cnt={p:0,g:0,o:0,m:0},miss={},items=[];
  exp.forEach(function(e){
    var best=-1,bd=9;
    P.taps.forEach(function(t,i){if(used[i])return;var d=Math.abs(t-e.sec);if(d<bd){bd=d;best=i;}});
    var cls='st-miss',w=0,text='miss',err=null;
    if(best>=0&&bd<=win){
      used[best]=1;var dt=P.taps[best]-e.sec;dts.push(dt);err=Math.round(dt*1000);text=(err>0?'+':'')+err;
      if(bd<=0.065){cls='st-perfect';w=1;cnt.p++;}else if(bd<=0.115){cls='st-good';w=0.85;cnt.g++;}else if(bd<=0.19){cls='st-ok';w=0.55;cnt.o++;}else{w=0.2;cnt.m++;}
    }else cnt.m++;
    if(w<0.85){miss[tokName(e.t,0)]=1;}
    tok[e.mi][e.ti]=cls;lab[e.mi][e.ti]={t:text,cls:cls};sum+=w;
    if(cls!=='st-perfect')items.push({sec:e.sec,cls:cls,pos:'Bar '+(e.mi+1)+' · '+beatLabel(M,e.pos),what:err===null?'Missed':(cls==='st-good'?'Close: ':(err<0?'Early by ':'Late by '))+(err===null?'':(cls==='st-good'?(err<0?'early ':'late ')+Math.abs(err)+' ms':Math.abs(err)+' ms'))});
  });
  var extras=0,extraList=[];
  P.taps.forEach(function(t,i){
    if(!used[i]&&t>=P.tEx-0.2){
      extras++;var tick=clamp((t-P.tEx)/P.tickSec,0,P.total-1),mi=Math.min(ex.measures.length-1,Math.floor(tick/M.cap));
      extraList.push({mi:mi,tick:tick-mi*M.cap});
      items.push({sec:t,cls:'extra',pos:'Bar '+(mi+1)+' · '+beatLabel(M,tick-mi*M.cap),what:'Extra tap'});
    }
  });
  var pct=Math.max(0,Math.round(sum/exp.length*100-extras*4));
  P.tokCls=tok;P.lab=lab;P.extraList=extraList;
  P.resCls=ex.measures.map(function(m,mi){var ok=0,n=0;m.forEach(function(t,ti){if(!t.r){n++;if(tok[mi][ti]==='st-perfect'||tok[mi][ti]==='st-good')ok++;}});return n&&ok===n?'ok':'bad';});
  P.done=true;P.redraw();
  var avg=dts.length?dts.reduce(function(a,b){return a+b;},0)/dts.length*1000:0;
  var timing=Math.abs(avg)<8?'Right on the beat':(Math.abs(Math.round(avg))+' ms '+(avg<0?'early':'late')+' on average');
  var legend='<div class="legend"><span><i style="background:var(--ok)"></i>Perfect '+cnt.p+'</span><span><i style="background:#7BB800"></i>Close '+cnt.g+'</span><span><i style="background:var(--warn)"></i>Early/late '+cnt.o+'</span><span><i style="background:var(--bad)"></i>Missed '+cnt.m+'</span>'+(extras?'<span><i style="background:var(--extra)"></i>Extra taps '+extras+'</span>':'')+'</div>';
  items.sort(function(a,b){return a.sec-b.sec;});
  var list='<h3 style="font-size:17px;margin-top:4px">Every mistake</h3>'+(items.length?'<div class="group misc">'+items.map(function(x){return '<div class="mi '+(x.cls==='st-good'?'good':(x.cls==='st-ok'?'ok':(x.cls==='extra'?'extra':'')))+'"><i></i><span class="pos">'+x.pos+'</span><span class="what">'+esc(x.what)+'</span></div>';}).join('')+'</div>':'<p class="hint">No mistakes. Every note landed.</p>');
  var bad=[];P.resCls.forEach(function(r,i){var ex2=extraList.some(function(e2){return e2.mi===i;});if(r!=='ok'||ex2)bad.push(i);});P.badBars=bad;
  var tr='';
  if(bad.length){
    tr='<h3 style="font-size:17px;margin-top:10px">Practise your trouble spots</h3><p class="hint" style="padding:0 0 8px">Tap a bar to get a new exercise built from that rhythm.</p><div class="troub">'+bad.map(function(i){return '<button type="button" data-act="rhprac" data-i="'+i+'">'+miniBar(M,ex.measures[i])+'<b>Bar '+(i+1)+' · Practise</b></button>';}).join('')+(bad.length>1?'<button type="button" data-act="rhprac" data-i="all"><span>All '+bad.length+' bars together</span><b>Practise all</b></button>':'')+'</div>';
  }
  list=tr+list;
  showResult({inline:true,pct:pct,title:P.title,n:exp.length,miss:Object.keys(miss),sub:timing,legend:legend,list:list,
    stats:function(s){return [['Notes',exp.length],['Extra taps',extras],['Tempo',P.c.bpm+' bpm']];}});
}

function dUsed(){return sumT(P.ans.m[P.ans.cur]);}
function dCanAdd(b){var t=tickOf(b,P.ans.dot,P.ans.tri);return t>0&&dUsed()+t<=P.M.cap;}
function drefresh(){
  if(!P||P.mode!=='dict')return;var a=P.ans,btns=$('durs');if(!btns)return;
  Array.prototype.forEach.call(btns.children,function(b){var k=b.dataset.b;b.disabled=P.done||!dCanAdd(k);b.innerHTML=durGlyph(k,a.dot,a.rest,a.tri)+'<span>'+NAMES[k]+'</span>';b.setAttribute('aria-label',NAMES[k]+(a.dot?' dotted':'')+(a.tri?' triplet':'')+(a.rest?' rest':''));});

  var full=a.m.every(function(m){return sumT(m)===P.M.cap;});$('bcheck').disabled=!full||P.done;
  setProg(a.m.reduce(function(s,m){return s+sumT(m);},0)/(P.M.cap*a.m.length)*0.9);

function dAfterEdit(){

ACT.dadd=function(el){
